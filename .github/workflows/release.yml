name: Windows candidate release evidence

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Three-part candidate version; must match Launcher Cargo.toml"
        required: true
        type: string

permissions: {}

concurrency:
  group: candidate-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-images:
    name: Build immutable Linux images and evidence
    needs: signing-environment-preflight
    if: needs.signing-environment-preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      artifact_suffix: ${{ steps.prepare.outputs.artifact_suffix }}
      evidence_artifact: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the validator Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install hash-locked acceptance validator dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r backend/requirements-dev.lock

      - name: Require a main-branch candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Validate candidate identity
        id: prepare
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/prepare_candidate.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --ref-type "${GITHUB_REF_TYPE}" \
            --manual-version "${MANUAL_VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output-directory "${RUNNER_TEMP}/linux-candidate-evidence" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Define immutable artifact name
        id: artifact-name
        shell: bash
        env:
          ARTIFACT_SUFFIX: ${{ steps.prepare.outputs.artifact_suffix }}
        run: |
          set -euo pipefail
          echo "name=linux-candidate-evidence-${ARTIFACT_SUFFIX}" >> "${GITHUB_OUTPUT}"

      - name: Bind an explicit blocked acceptance manifest to this candidate
        shell: bash
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          EVIDENCE_DIRECTORY: ${{ steps.prepare.outputs.evidence_directory }}
        run: |
          set -euo pipefail
          python scripts/acceptance/build_requirements_catalog.py \
            --matrix docs/12_需求追踪矩阵.md \
            --output docs/contracts/requirements-catalog.v1.json \
            --check
          cp \
            docs/contracts/requirements-catalog.v1.json \
            "${EVIDENCE_DIRECTORY}/requirements-catalog.v1.json"
          cp \
            docs/contracts/windows-e4-scenario-profile.v1.json \
            "${EVIDENCE_DIRECTORY}/windows-e4-scenario-profile.v1.json"
          python scripts/acceptance/windows_e4_scenarios.py \
            profile \
            --profile "${EVIDENCE_DIRECTORY}/windows-e4-scenario-profile.v1.json" \
            --catalog "${EVIDENCE_DIRECTORY}/requirements-catalog.v1.json" \
            --require-authoritative
          python scripts/acceptance/build_blocked_manifest.py \
            --catalog "${EVIDENCE_DIRECTORY}/requirements-catalog.v1.json" \
            --environment-manifest "${EVIDENCE_DIRECTORY}/release-context.json" \
            --release-candidate "${VERSION}-${GITHUB_SHA:0:12}" \
            --commit "${GITHUB_SHA}" \
            --output "${EVIDENCE_DIRECTORY}/acceptance-manifest.json"
          python scripts/acceptance/validate_acceptance_manifest.py \
            --catalog "${EVIDENCE_DIRECTORY}/requirements-catalog.v1.json" \
            --matrix docs/12_需求追踪矩阵.md \
            --manifest "${EVIDENCE_DIRECTORY}/acceptance-manifest.json" \
            --schema docs/contracts/acceptance-manifest.v1.schema.json \
            --environment-manifest "${EVIDENCE_DIRECTORY}/release-context.json" \
            --evidence-root "${EVIDENCE_DIRECTORY}"

      - name: Authenticate to GHCR with the job token
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Create an isolated Buildx builder
        id: buildx
        shell: bash
        run: |
          set -euo pipefail
          builder="des-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx create \
            --name "${builder}" \
            --driver docker-container \
            --use
          docker buildx inspect --bootstrap
          echo "name=${builder}" >> "${GITHUB_OUTPUT}"

      - name: Build and push API, Worker, egress guard, and Web by linux/amd64 digest
        shell: bash
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          EVIDENCE_DIRECTORY: ${{ steps.prepare.outputs.evidence_directory }}
        run: |
          bash scripts/release/build_and_lock_images.sh \
            "${VERSION}" \
            "${GITHUB_SHA}" \
            "${EVIDENCE_DIRECTORY}"

      - name: Install checksum-pinned Syft
        shell: bash
        run: |
          bash scripts/release/install_syft.sh "${RUNNER_TEMP}/syft"

      - name: Generate source and container SPDX SBOMs
        shell: bash
        env:
          EVIDENCE_DIRECTORY: ${{ steps.prepare.outputs.evidence_directory }}
        run: |
          bash scripts/release/generate_sboms.sh \
            "${RUNNER_TEMP}/syft" \
            "${EVIDENCE_DIRECTORY}"

      - name: Install checksum-pinned OSV-Scanner
        shell: bash
        run: bash scripts/security/install_osv_scanner.sh "${RUNNER_TEMP}/osv-scanner"

      - name: Install checksum-pinned Grype
        shell: bash
        run: bash scripts/security/install_grype.sh "${RUNNER_TEMP}/grype"

      - name: Enforce application and distro vulnerability policies
        shell: bash
        env:
          EVIDENCE_DIRECTORY: ${{ steps.prepare.outputs.evidence_directory }}
        run: |
          bash scripts/security/scan_release_sboms.sh \
            "${RUNNER_TEMP}/osv-scanner" \
            "${RUNNER_TEMP}/grype" \
            "${EVIDENCE_DIRECTORY}"

      - name: End authenticated registry session before public-read gate
        shell: bash
        run: docker logout ghcr.io

      - name: Require anonymous pull access to every locked image
        shell: bash
        env:
          EVIDENCE_DIRECTORY: ${{ steps.prepare.outputs.evidence_directory }}
        run: |
          set -euo pipefail
          python3 scripts/release/verify_anonymous_image_pulls.py \
            --images "${EVIDENCE_DIRECTORY}/images.release.env" \
            --evidence "${EVIDENCE_DIRECTORY}/anonymous-image-pulls.json"

      - name: Write and verify the Linux evidence hash manifest
        shell: bash
        env:
          EVIDENCE_DIRECTORY: ${{ steps.prepare.outputs.evidence_directory }}
        run: |
          set -euo pipefail
          python3 scripts/release/hash_manifest.py \
            write \
            --root "${EVIDENCE_DIRECTORY}"
          python3 scripts/release/hash_manifest.py \
            verify \
            --root "${EVIDENCE_DIRECTORY}"

      - name: Remove the isolated Buildx builder
        if: always() && steps.buildx.outputs.name != ''
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: docker buildx rm "${BUILDER_NAME}"

      - name: End the GHCR session
        if: always()
        shell: bash
        run: docker logout ghcr.io || true

      - name: Upload candidate Linux evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ steps.prepare.outputs.evidence_directory }}
          if-no-files-found: error
          retention-days: 30

  signing-environment-preflight:
    name: Verify the pre-existing signing gate before a signing job can reference it
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      environment_id: ${{ steps.verify.outputs.environment_id }}
      protection_sha256: ${{ steps.verify.outputs.protection_sha256 }}
    steps:
      - name: Check out the exact candidate verifier without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the signing-environment verifier Python runtime
        id: signing-environment-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Read and strictly validate the pre-existing signing environment
        id: verify
        shell: bash
        env:
          EXPECTED_ENVIRONMENT: windows-candidate-signing
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIER_PYTHON: ${{ steps.signing-environment-python.outputs.python-path }}
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_TOKEN}" || -z "${VERIFIER_PYTHON}" ]]; then
            echo "Signing-environment preflight has no GitHub token or verifier Python." >&2
            exit 1
          fi
          environment_name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${EXPECTED_ENVIRONMENT}")"
          environment_uri="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/environments/${environment_name}"
          environment_path="${RUNNER_TEMP}/signing-environment-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          branch_policies_uri="${environment_uri}/deployment-branch-policies?per_page=100"
          branch_policies_path="${RUNNER_TEMP}/signing-environment-branch-policies-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          if [[ -e "${environment_path}" || -e "${branch_policies_path}" ]]; then
            echo "Signing-environment response path already exists." >&2
            exit 1
          fi
          trap 'rm -f -- "${environment_path:-}" "${branch_policies_path:-}"' EXIT
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --max-time 20 \
            --request GET \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "${environment_path}" \
            "${environment_uri}"
          selector_mode="$("${VERIFIER_PYTHON}" \
            scripts/release/verify_signing_environment.py \
            --environment-json "${environment_path}" \
            --selector-mode)"
          branch_policy_arguments=()
          if [[ "${selector_mode}" == "custom" ]]; then
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --max-time 20 \
              --request GET \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "${branch_policies_path}" \
              "${branch_policies_uri}"
            branch_policy_arguments=(
              --deployment-branch-policies-json "${branch_policies_path}"
            )
          elif [[ "${selector_mode}" != "not-custom" ]]; then
            echo "Signing-environment selector mode is invalid." >&2
            exit 1
          fi
          verification_json="$("${VERIFIER_PYTHON}" \
            scripts/release/verify_signing_environment.py \
            --environment-json "${environment_path}" \
            --expected-environment "${EXPECTED_ENVIRONMENT}" \
            "${branch_policy_arguments[@]}")"
          VERIFICATION_JSON="${verification_json}" \
            "${VERIFIER_PYTHON}" - "${GITHUB_OUTPUT}" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          result = json.loads(os.environ["VERIFICATION_JSON"])
          environment_id = result.get("environment_id")
          protection_sha256 = result.get("protection_sha256")
          if (
              result.get("ready") is not True
              or result.get("code") != "WINDOWS_SIGNING_ENVIRONMENT_PROTECTION_VALID"
              or result.get("environment") != "windows-candidate-signing"
              or isinstance(environment_id, bool)
              or not isinstance(environment_id, int)
              or environment_id < 1
              or not isinstance(protection_sha256, str)
              or re.fullmatch(r"[0-9a-f]{64}", protection_sha256) is None
          ):
              raise SystemExit("Signing-environment verifier returned an invalid snapshot.")
          with Path(sys.argv[1]).open("a", encoding="utf-8") as output:
              output.write("ready=true\n")
              output.write(f"environment_id={environment_id}\n")
              output.write(f"protection_sha256={protection_sha256}\n")
          PY

  windows-signed-candidate:
    name: Sign and verify the Windows candidate
    needs:
      - linux-images
      - signing-environment-preflight
    if: needs.signing-environment-preflight.outputs.ready == 'true'
    runs-on:
      group: datax-release-signing
      labels:
        - self-hosted
        - windows
        - x64
        - datax-release-windows11
    environment: windows-candidate-signing
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up the signing-environment verifier Python runtime
        id: signing-environment-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Revalidate the pre-existing approval-gated signing environment before secrets
        shell: pwsh
        env:
          EXPECTED_ENVIRONMENT: windows-candidate-signing
          EXPECTED_ENVIRONMENT_ID: ${{ needs.signing-environment-preflight.outputs.environment_id }}
          EXPECTED_PROTECTION_SHA256: ${{ needs.signing-environment-preflight.outputs.protection_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIER_PYTHON: ${{ steps.signing-environment-python.outputs.python-path }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:VERIFIER_PYTHON) -or
              $env:EXPECTED_ENVIRONMENT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:EXPECTED_PROTECTION_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
              throw "Signing-environment revalidation has no valid preflight identity, hash, token, or verifier Python."
          }
          $environmentName = [Uri]::EscapeDataString($env:EXPECTED_ENVIRONMENT)
          $environmentUri = (
              "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/environments/$environmentName"
          )
          $environmentPath = Join-Path `
              $env:RUNNER_TEMP `
              "signing-environment-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          $branchPoliciesPath = Join-Path `
              $env:RUNNER_TEMP `
              "signing-environment-branch-policies-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if ((Test-Path -LiteralPath $environmentPath) -or
              (Test-Path -LiteralPath $branchPoliciesPath)) {
            throw "Signing-environment response path already exists."
          }
          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GITHUB_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          try {
              $response = Invoke-WebRequest `
                  -Uri $environmentUri `
                  -Headers $headers `
                  -UseBasicParsing
              [IO.File]::WriteAllText(
                  $environmentPath,
                  $response.Content,
                  [Text.UTF8Encoding]::new($false)
              )
              $selectorMode = @(& $env:VERIFIER_PYTHON `
                  scripts/release/verify_signing_environment.py `
                  --environment-json $environmentPath `
                  --selector-mode)
              if ($LASTEXITCODE -ne 0 -or
                  $selectorMode.Count -ne 1 -or
                  $selectorMode[0] -notin @("custom", "not-custom")) {
                  throw "GitHub signing environment selector-mode preflight failed."
              }
              $branchPolicyArguments = @()
              if ($selectorMode[0] -eq "custom") {
                  $branchPoliciesUri = (
                      "$environmentUri/deployment-branch-policies?per_page=100"
                  )
                  $branchPoliciesResponse = Invoke-WebRequest `
                      -Uri $branchPoliciesUri `
                      -Headers $headers `
                      -UseBasicParsing
                  [IO.File]::WriteAllText(
                      $branchPoliciesPath,
                      $branchPoliciesResponse.Content,
                      [Text.UTF8Encoding]::new($false)
                  )
                  $branchPolicyArguments = @(
                      "--deployment-branch-policies-json",
                      $branchPoliciesPath
                  )
              }
              & $env:VERIFIER_PYTHON `
                  scripts/release/verify_signing_environment.py `
                  --environment-json $environmentPath `
                  --expected-environment $env:EXPECTED_ENVIRONMENT `
                  --expected-environment-id $env:EXPECTED_ENVIRONMENT_ID `
                  --expected-protection-sha256 $env:EXPECTED_PROTECTION_SHA256 `
                  @branchPolicyArguments
              if ($LASTEXITCODE -ne 0) {
                  throw "GitHub signing environment protection preflight failed."
              }
          }
          finally {
              if (Test-Path -LiteralPath $environmentPath) {
                  Remove-Item -LiteralPath $environmentPath -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $branchPoliciesPath) {
                  Remove-Item -LiteralPath $branchPoliciesPath -Force -ErrorAction Stop
              }
          }

      - name: Download immutable Linux evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux-images.outputs.evidence_artifact }}
          path: ${{ runner.temp }}/linux-candidate-evidence

      - name: Verify downloaded evidence before signing
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.linux-images.outputs.version }}
        run: |
          & .\scripts\release\verify-hash-manifest.ps1 `
            -RootDirectory "${env:RUNNER_TEMP}\linux-candidate-evidence"
          $contextPath = Join-Path `
            "${env:RUNNER_TEMP}\linux-candidate-evidence" `
            "release-context.json"
          $context = Get-Content -LiteralPath $contextPath -Raw |
            ConvertFrom-Json
          if ($context.git_commit -ne $env:GITHUB_SHA -or
              $context.version -ne $env:EXPECTED_VERSION -or
              $context.candidate_only -ne $true -or
              $context.public_release_created -ne $false) {
              throw "Downloaded release context does not match this workflow."
          }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) {
              throw "Windows checkout does not match the candidate commit."
          }

      - name: Parse publisher-binding release scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
              "scripts/windows/build-installer.ps1",
              "scripts/windows/validate-release.ps1",
              "scripts/release/finalize_windows_publisher_binding.ps1",
              "scripts/release/verify_windows_publisher_binding.ps1"
          )) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path -LiteralPath $path),
                  [ref]$tokens,
                  [ref]$errors
              )
              if ($errors.Count -ne 0) {
                  $errors | ForEach-Object { Write-Error $_.Message }
                  throw "PowerShell parse failed: $path"
              }
          }

      - name: Require a clean checkout and configured local signing tools
        shell: pwsh
        env:
          CARGO_PATH: ${{ vars.CARGO_PATH }}
          MAKENSIS_PATH: ${{ vars.MAKENSIS_PATH }}
          RUSTC_PATH: ${{ vars.RUSTC_PATH }}
          SIGNTOOL_PATH: ${{ vars.SIGNTOOL_PATH }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) {
              throw "The signing checkout has tracked modifications."
          }
          $status = @(
              git status --porcelain=v1 --untracked-files=all
          )
          if ($status.Count -ne 0) {
              throw "The signing checkout has staged or untracked files."
          }
          function Assert-ConfiguredLocalExecutable {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Name,
                  [Parameter(Mandatory = $true)]
                  [string]$Candidate
              )

              if ([string]::IsNullOrWhiteSpace($Candidate) -or
                  $Candidate -notmatch '^[A-Za-z]:\\') {
                  throw "Configured path for $Name is missing or not local."
              }
              try {
                  $fullPath = [IO.Path]::GetFullPath($Candidate)
                  $disk = Get-CimInstance `
                      -ClassName Win32_LogicalDisk `
                      -Filter "DeviceID='$($fullPath.Substring(0, 2))'" `
                      -ErrorAction Stop
              }
              catch {
                  throw "Configured path for $Name is not on a local fixed volume."
              }
              if ($null -eq $disk -or [int]$disk.DriveType -ne 3) {
                  throw "Configured path for $Name is not on a local fixed volume."
              }
              $root = [IO.Path]::GetPathRoot($fullPath)
              if ([string]::IsNullOrWhiteSpace($root)) {
                  throw "Configured path for $Name is invalid."
              }
              if ($fullPath.Length -le $root.Length) {
                  throw "Configured path for $Name is not a regular executable."
              }
              $current = $root
              foreach ($segment in ($fullPath.Substring($root.Length) -split '[\\/]')) {
                  if ([string]::IsNullOrWhiteSpace($segment)) {
                      continue
                  }
                  $current = Join-Path -Path $current -ChildPath $segment
                  try {
                      $item = Get-Item `
                          -LiteralPath $current `
                          -Force `
                          -ErrorAction Stop
                  }
                  catch {
                      throw "Configured path for $Name cannot be accessed."
                  }
                  if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                      throw "Configured path for $Name contains a reparse point."
                  }
              }
              if ($item.PSIsContainer -or
                  $item.Length -le 0 -or
                  -not [IO.Path]::GetFileName($item.FullName).Equals(
                      $Name,
                      [StringComparison]::OrdinalIgnoreCase
                  )) {
                  throw "Configured path for $Name is not a regular executable."
              }
          }
          function Assert-NoCargoCompilerOverrides {
              $forbiddenVariables = @(
                  "RUSTC_WRAPPER",
                  "RUSTC_WORKSPACE_WRAPPER",
                  "RUSTFLAGS",
                  "CARGO_ENCODED_RUSTFLAGS",
                  "CARGO_BUILD_RUSTFLAGS",
                  "CARGO_BUILD_RUSTC",
                  "CARGO_BUILD_RUSTC_WRAPPER",
                  "CARGO_TARGET_DIR",
                  "CARGO_HOME",
                  "RUSTUP_HOME",
                  "RUSTUP_TOOLCHAIN",
                  "RUSTC_BOOTSTRAP"
              )
              foreach ($name in $forbiddenVariables) {
                  $value = [Environment]::GetEnvironmentVariable(
                      $name,
                      [EnvironmentVariableTarget]::Process
                  )
                  if (-not [string]::IsNullOrWhiteSpace($value)) {
                      throw "Ambient compiler override $name is forbidden for release signing."
                  }
              }
              $environment = [Environment]::GetEnvironmentVariables(
                  [EnvironmentVariableTarget]::Process
              )
              foreach ($name in $environment.Keys) {
                  $nameText = [string]$name
                  if ($nameText.StartsWith(
                      "CARGO_TARGET_",
                      [StringComparison]::OrdinalIgnoreCase
                  ) -or $nameText -match '^CARGO_PROFILE_[A-Z0-9_]+_RUSTFLAGS$') {
                      throw "Ambient Cargo target or profile compiler override is forbidden for release signing."
                  }
              }
          }
          $requiredTools = [ordered]@{
              "cargo.exe" = $env:CARGO_PATH
              "makensis.exe" = $env:MAKENSIS_PATH
              "rustc.exe" = $env:RUSTC_PATH
              "signtool.exe" = $env:SIGNTOOL_PATH
          }
          foreach ($entry in $requiredTools.GetEnumerator()) {
              Assert-ConfiguredLocalExecutable `
                  -Name $entry.Key `
                  -Candidate ([string]$entry.Value)
          }
          Assert-NoCargoCompilerOverrides

      - name: Require and import the protected signing certificate
        id: signing-certificate
        shell: pwsh
        env:
          CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
          EXPECTED_SHA256_ALLOWLIST_JSON: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_SHA256_ALLOWLIST_JSON }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD) -or
              $env:EXPECTED_THUMBPRINT -cnotmatch '^[0-9A-Fa-f]{40}$' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_SHA256_ALLOWLIST_JSON)) {
              throw "All protected Windows signing identity secrets are required."
          }
          $expected = $env:EXPECTED_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          $pfxPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate-signing-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.pfx"
          $thumbprintsPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate-imported-certificates-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt"
          $allowlistPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate-publisher-allowlist-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if (Test-Path -LiteralPath $pfxPath) {
              throw "Signing certificate staging path already exists."
          }
          if (Test-Path -LiteralPath $thumbprintsPath) {
              throw "Signing certificate cleanup list already exists."
          }
          if (Test-Path -LiteralPath $allowlistPath) {
              throw "Publisher allowlist staging path already exists."
          }
          $allowlistDocument = $env:EXPECTED_SHA256_ALLOWLIST_JSON |
            ConvertFrom-Json
          $allowlistProperties = @(
              $allowlistDocument.PSObject.Properties.Name
          )
          if ($allowlistProperties.Count -ne 2 -or
              $allowlistProperties[0] -cne "schema_version" -or
              $allowlistProperties[1] -cne "allowed_authenticode_signer_certificate_sha256" -or
              $allowlistDocument.schema_version -cne "1.0") {
              throw "Protected publisher allowlist schema is invalid."
          }
          $allowedSha256 = @(
              $allowlistDocument.allowed_authenticode_signer_certificate_sha256
          )
          if ($allowedSha256.Count -lt 1 -or $allowedSha256.Count -gt 8) {
              throw "Protected publisher allowlist must contain one to eight identities."
          }
          for ($index = 0; $index -lt $allowedSha256.Count; $index++) {
              if ($allowedSha256[$index] -isnot [string] -or
                  $allowedSha256[$index] -cnotmatch '^[0-9a-f]{64}$') {
                  throw "Protected publisher allowlist contains an invalid SHA-256."
              }
              if ($index -gt 0 -and
                  [string]::CompareOrdinal(
                      $allowedSha256[$index - 1],
                      $allowedSha256[$index]
                  ) -ge 0) {
                  throw "Protected publisher allowlist must be ordinal-sorted and unique."
              }
          }
          $canonicalAllowlist = [ordered]@{
              schema_version = "1.0"
              allowed_authenticode_signer_certificate_sha256 = @($allowedSha256)
          }
          $canonicalAllowlistJson = $canonicalAllowlist |
            ConvertTo-Json -Compress
          if ($env:EXPECTED_SHA256_ALLOWLIST_JSON -cne $canonicalAllowlistJson) {
              throw "Protected publisher allowlist must use the exact canonical JSON form."
          }
          $inspection = $null
          try {
              $bytes = [Convert]::FromBase64String(
                  $env:CERTIFICATE_PFX_BASE64
              )
              if ($bytes.Length -lt 512) {
                  throw "Signing certificate payload is invalid."
              }
              [IO.File]::WriteAllBytes($pfxPath, $bytes)
              $inspection = (
                  [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
              )
              $inspection.Import(
                  $bytes,
                  $env:CERTIFICATE_PASSWORD,
                  [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
              )
              $pfxThumbprints = @(
                  $inspection |
                    ForEach-Object {
                        $_.Thumbprint.Replace(" ", "").ToUpperInvariant()
                    } |
                    Sort-Object -Unique
              )
              $inspectionSigner = @(
                  $inspection |
                    Where-Object {
                        $_.Thumbprint.Replace(" ", "").Equals(
                            $expected,
                            [StringComparison]::OrdinalIgnoreCase
                        )
                    }
              )
              if ($inspectionSigner.Count -ne 1 -or
                  -not $inspectionSigner[0].HasPrivateKey) {
                  throw "The PFX does not contain the expected signing private key."
              }
              $now = Get-Date
              if ($inspectionSigner[0].NotBefore -gt $now -or
                  $inspectionSigner[0].NotAfter -le $now) {
                  throw "The signing certificate is not currently valid."
              }
              $codeSigning = @(
                  $inspectionSigner[0].Extensions |
                    Where-Object { $_.Oid.Value -eq "2.5.29.37" } |
                    ForEach-Object { $_.EnhancedKeyUsages } |
                    Where-Object { $_.Value -eq "1.3.6.1.5.5.7.3.3" }
              )
              if ($codeSigning.Count -eq 0) {
                  throw "The certificate is not authorized for code signing."
              }
              $actualSha256 = $inspectionSigner[0].GetCertHashString(
                  [Security.Cryptography.HashAlgorithmName]::SHA256
              ).ToLowerInvariant()
              $sha256Allowed = $false
              foreach ($allowed in $allowedSha256) {
                  if ($allowed.Equals(
                      $actualSha256,
                      [StringComparison]::Ordinal
                  )) {
                      $sha256Allowed = $true
                  }
              }
              if (-not $sha256Allowed) {
                  throw "The PFX signer is absent from the protected SHA-256 allowlist."
              }
              [IO.File]::WriteAllText(
                  $allowlistPath,
                  $canonicalAllowlistJson,
                  [Text.UTF8Encoding]::new($false)
              )
              $existingThumbprints = (
                  [Collections.Generic.HashSet[string]]::new(
                      [StringComparer]::OrdinalIgnoreCase
                  )
              )
              foreach ($certificate in (
                  Get-ChildItem -LiteralPath "Cert:\CurrentUser\My"
              )) {
                  [void]$existingThumbprints.Add(
                      $certificate.Thumbprint.Replace(" ", "")
                  )
              }
              if ($existingThumbprints.Contains($expected)) {
                  throw "The expected signer already exists in the runner certificate store."
              }
              $cleanupThumbprints = @(
                  $pfxThumbprints |
                    Where-Object { -not $existingThumbprints.Contains($_) }
              )
              if ($cleanupThumbprints -notcontains $expected) {
                  throw "The expected signer is missing from the cleanup set."
              }
              [IO.File]::WriteAllLines(
                  $thumbprintsPath,
                  $cleanupThumbprints,
                  [Text.Encoding]::ASCII
              )
              $password = ConvertTo-SecureString `
                $env:CERTIFICATE_PASSWORD `
                -AsPlainText `
                -Force
              $imported = @(
                  Import-PfxCertificate `
                    -FilePath $pfxPath `
                    -CertStoreLocation "Cert:\CurrentUser\My" `
                    -Password $password
              )
              $signerPath = "Cert:\CurrentUser\My\$expected"
              $signer = Get-Item -LiteralPath $signerPath -ErrorAction Stop
              if (-not $signer.HasPrivateKey) {
                  throw "The imported signing certificate has no private key."
              }
              "thumbprint=$expected" >> $env:GITHUB_OUTPUT
              "sha256=$actualSha256" >> $env:GITHUB_OUTPUT
              "allowlist_path=$allowlistPath" >> $env:GITHUB_OUTPUT
          }
          finally {
              if (Test-Path -LiteralPath $pfxPath) {
                  Remove-Item -LiteralPath $pfxPath -Force
              }
              if ($null -ne $inspection) {
                  foreach ($certificate in $inspection) {
                      $certificate.Dispose()
                  }
              }
          }
          if (@(
              $imported |
                Where-Object {
                    $_.Thumbprint.Replace(" ", "").Equals(
                        $expected,
                        [StringComparison]::OrdinalIgnoreCase
                    )
                }
          ).Count -ne 1) {
              throw "The expected signing certificate was not imported exactly once."
          }

      - name: Build and sign Launcher and Setup
        id: build
        shell: pwsh
        env:
          VERSION: ${{ needs.linux-images.outputs.version }}
          SIGNER_THUMBPRINT: ${{ steps.signing-certificate.outputs.thumbprint }}
          SIGNER_ALLOWLIST_PATH: ${{ steps.signing-certificate.outputs.allowlist_path }}
          CARGO_PATH: ${{ vars.CARGO_PATH }}
          RUSTC_PATH: ${{ vars.RUSTC_PATH }}
          MAKENSIS_PATH: ${{ vars.MAKENSIS_PATH }}
          SIGNTOOL_PATH: ${{ vars.SIGNTOOL_PATH }}
          TIMESTAMP_URL: https://timestamp.digicert.com
        run: |
          $ErrorActionPreference = "Stop"
          $outputDirectory = Join-Path `
            $env:RUNNER_TEMP `
            "windows-candidate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $outputDirectory) {
              throw "Windows candidate output directory already exists."
          }
          $parameters = @{
              ProductVersion = $env:VERSION
              ReleaseImagesFile = (
                  Join-Path `
                    "${env:RUNNER_TEMP}\linux-candidate-evidence" `
                    "images.release.env"
              )
              OutputDirectory = $outputDirectory
              CargoPath = $env:CARGO_PATH
              RustcPath = $env:RUSTC_PATH
              MakensisPath = $env:MAKENSIS_PATH
              SigntoolPath = $env:SIGNTOOL_PATH
              SigningCertificateThumbprint = $env:SIGNER_THUMBPRINT
              AllowedSignerFile = $env:SIGNER_ALLOWLIST_PATH
              TimestampUrl = $env:TIMESTAMP_URL
          }
          & .\scripts\windows\build-installer.ps1 @parameters
          $bindingParameters = @{
              ProductVersion = $env:VERSION
              BuildOutputDirectory = $outputDirectory
              CargoPath = $env:CARGO_PATH
              RustcPath = $env:RUSTC_PATH
              MakensisPath = $env:MAKENSIS_PATH
              SigntoolPath = $env:SIGNTOOL_PATH
              SigningCertificateThumbprint = $env:SIGNER_THUMBPRINT
              AllowedSignerFile = $env:SIGNER_ALLOWLIST_PATH
              TimestampUrl = $env:TIMESTAMP_URL
          }
          & .\scripts\release\finalize_windows_publisher_binding.ps1 `
            @bindingParameters
          "output_directory=$outputDirectory" >> $env:GITHUB_OUTPUT

      - name: Recheck tracked sources before candidate assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) {
              throw "The signing toolchain modified tracked candidate sources before assembly."
          }

      - name: Assemble and verify the signed candidate evidence
        id: candidate
        shell: pwsh
        env:
          VERSION: ${{ needs.linux-images.outputs.version }}
          SIGNER_THUMBPRINT: ${{ steps.signing-certificate.outputs.thumbprint }}
          BUILD_OUTPUT: ${{ steps.build.outputs.output_directory }}
          SIGNER_ALLOWLIST_PATH: ${{ steps.signing-certificate.outputs.allowlist_path }}
          CARGO_PATH: ${{ vars.CARGO_PATH }}
          RUSTC_PATH: ${{ vars.RUSTC_PATH }}
          SIGNTOOL_PATH: ${{ vars.SIGNTOOL_PATH }}
        run: |
          $ErrorActionPreference = "Stop"
          $candidateDirectory = Join-Path `
            $env:RUNNER_TEMP `
            "signed-candidate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $candidateDirectory) {
              throw "Signed candidate directory already exists."
          }
          [IO.Directory]::CreateDirectory($candidateDirectory) | Out-Null
          $linuxEvidence = Join-Path $candidateDirectory "linux-evidence"
          Copy-Item `
            -LiteralPath "${env:RUNNER_TEMP}\linux-candidate-evidence" `
            -Destination $linuxEvidence `
            -Recurse
          $setupName = "DataX-Enterprise-Studio-Setup-$env:VERSION-x64.exe"
          $setupSource = Join-Path $env:BUILD_OUTPUT $setupName
          $launcherSource = Join-Path `
            $env:BUILD_OUTPUT `
            "staging-$env:VERSION\launcher.exe"
          $setup = Join-Path $candidateDirectory $setupName
          $launcher = Join-Path $candidateDirectory "launcher.exe"
          Copy-Item -LiteralPath $setupSource -Destination $setup
          Copy-Item -LiteralPath $launcherSource -Destination $launcher
          $resourcesSource = Join-Path `
            $env:BUILD_OUTPUT `
            "staging-$env:VERSION\resources"
          $resources = Join-Path $candidateDirectory "resources"
          Copy-Item `
            -LiteralPath $resourcesSource `
            -Destination $resources `
            -Recurse
          Copy-Item `
            -LiteralPath (Join-Path $linuxEvidence "images.release.env") `
            -Destination (Join-Path $candidateDirectory "images.release.env")
          Copy-Item `
            -LiteralPath (Join-Path $linuxEvidence "release-context.json") `
            -Destination (Join-Path $candidateDirectory "release-context.json")
          & .\scripts\release\verify-hash-manifest.ps1 `
            -RootDirectory $linuxEvidence
          & .\scripts\release\verify_windows_publisher_binding.ps1 `
            -LauncherPath $launcher `
            -SetupPath $setup `
            -ResourcesDirectory $resources `
            -ExpectedVersion $env:VERSION `
            -ExpectedAllowlistFile $env:SIGNER_ALLOWLIST_PATH
          $parameters = @{
              CandidateDirectory = $candidateDirectory
              SetupPath = $setup
              LauncherPath = $launcher
              ImagesReleaseFile = (
                  Join-Path $candidateDirectory "images.release.env"
              )
              ReleaseContextFile = (
                  Join-Path $candidateDirectory "release-context.json"
              )
              ExpectedSignerThumbprint = $env:SIGNER_THUMBPRINT
              ExpectedVersion = $env:VERSION
              ExpectedCommit = $env:GITHUB_SHA
              CargoPath = $env:CARGO_PATH
              RustcPath = $env:RUSTC_PATH
              SigntoolPath = $env:SIGNTOOL_PATH
          }
          & .\scripts\windows\validate-release.ps1 @parameters
          & .\scripts\release\verify-hash-manifest.ps1 `
            -RootDirectory $candidateDirectory
          "directory=$candidateDirectory" >> $env:GITHUB_OUTPUT

      - name: Recheck tracked sources after all toolchain execution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) {
              throw "The signing toolchain modified tracked candidate sources after assembly."
          }

      - name: Remove imported signing certificates
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $thumbprintsPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate-imported-certificates-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt"
          if (Test-Path -LiteralPath $thumbprintsPath) {
              foreach ($thumbprint in (
                  Get-Content -LiteralPath $thumbprintsPath
              )) {
                  if ($thumbprint -match '^[0-9A-Fa-f]{40}$') {
                      $path = "Cert:\CurrentUser\My\$thumbprint"
                      if (Test-Path -LiteralPath $path) {
                          $certificate = Get-Item -LiteralPath $path
                          if ($certificate.HasPrivateKey) {
                              Remove-Item `
                                -LiteralPath $path `
                                -DeleteKey `
                                -Force
                          }
                          else {
                              Remove-Item -LiteralPath $path -Force
                          }
                      }
                      if (Test-Path -LiteralPath $path) {
                          throw "Failed to remove an imported signing certificate."
                      }
                  }
                  else {
                      throw "Signing certificate cleanup list is malformed."
                  }
              }
              Remove-Item -LiteralPath $thumbprintsPath -Force
          }
          $allowlistPath = Join-Path `
            $env:RUNNER_TEMP `
            "candidate-publisher-allowlist-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if (Test-Path -LiteralPath $allowlistPath) {
              Remove-Item -LiteralPath $allowlistPath -Force
          }

      - name: Upload signed candidate artifact and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocked-windows-handoff-candidate-${{ needs.linux-images.outputs.artifact_suffix }}
          path: ${{ steps.candidate.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  hosted-candidate-attestor:
    name: Attest the blocked candidate root on a GitHub-hosted runner
    needs:
      - linux-images
      - windows-signed-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up the candidate-root validator runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install hash-locked acceptance validator dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r backend/requirements-dev.lock

      - name: Download independently built Linux evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux-images.outputs.evidence_artifact }}
          path: ${{ runner.temp }}/trusted-linux-candidate-evidence

      - name: Download the complete blocked Windows handoff candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blocked-windows-handoff-candidate-${{ needs.linux-images.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/blocked-windows-handoff-candidate

      - name: Verify the handoff manifest and establish the canonical blocked root
        id: candidate-root
        shell: bash
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/blocked-windows-handoff-candidate
          TRUSTED_LINUX_EVIDENCE_DIRECTORY: ${{ runner.temp }}/trusted-linux-candidate-evidence
          VERSION: ${{ needs.linux-images.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test ! -e "${CANDIDATE_DIRECTORY}/candidate-root.v1.json"
          python scripts/release/hash_manifest.py \
            verify \
            --root "${TRUSTED_LINUX_EVIDENCE_DIRECTORY}"
          python scripts/release/hash_manifest.py \
            verify \
            --root "${CANDIDATE_DIRECTORY}"
          unlink "${CANDIDATE_DIRECTORY}/SHA256SUMS"
          test ! -e "${CANDIDATE_DIRECTORY}/SHA256SUMS"
          release_candidate="${VERSION}-${GITHUB_SHA:0:12}"
          python scripts/acceptance/candidate_root.py \
            generate \
            --candidate-directory "${CANDIDATE_DIRECTORY}" \
            --trusted-linux-evidence-directory "${TRUSTED_LINUX_EVIDENCE_DIRECTORY}" \
            --schema "${GITHUB_WORKSPACE}/docs/contracts/candidate-root.v1.schema.json" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-ref "${GITHUB_REF}" \
            --commit "${GITHUB_SHA}" \
            --product-version "${VERSION}" \
            --release-candidate "${release_candidate}" \
            --scenario-blocked-reason \
              "Candidate-bound Windows E4 result catalog is absent." \
            --scenario-blocked-reason \
              "Protected Windows E4 harness evidence is absent."
          python scripts/acceptance/candidate_root.py \
            validate \
            --candidate-directory "${CANDIDATE_DIRECTORY}" \
            --trusted-linux-evidence-directory "${TRUSTED_LINUX_EVIDENCE_DIRECTORY}" \
            --schema "${GITHUB_WORKSPACE}/docs/contracts/candidate-root.v1.schema.json" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-ref "${GITHUB_REF}" \
            --commit "${GITHUB_SHA}" \
            --product-version "${VERSION}" \
            --release-candidate "${release_candidate}"
          root_sha256="$(sha256sum "${CANDIDATE_DIRECTORY}/candidate-root.v1.json" | cut -d ' ' -f 1)"
          echo "path=${CANDIDATE_DIRECTORY}/candidate-root.v1.json" >> "${GITHUB_OUTPUT}"
          echo "sha256=${root_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Attest the canonical blocked candidate root
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ steps.candidate-root.outputs.path }}
          show-summary: false

      - name: Install the hash-locked GitHub CLI verifier
        id: trusted-gh
        shell: bash
        env:
          TRUSTED_GH_DIRECTORY: ${{ runner.temp }}/trusted-gh-cli
        run: |
          set -euo pipefail
          archive_url="$(python scripts/acceptance/trusted_gh_cli.py archive-url)"
          archive_path="${RUNNER_TEMP}/gh_2.97.0_linux_amd64.tar.gz"
          test ! -e "${archive_path}"
          mkdir -p "${TRUSTED_GH_DIRECTORY}"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${archive_path}" \
            "${archive_url}"
          python scripts/acceptance/trusted_gh_cli.py \
            install \
            --archive "${archive_path}" \
            --output "${TRUSTED_GH_DIRECTORY}/gh"
          python scripts/acceptance/trusted_gh_cli.py \
            verify \
            --executable "${TRUSTED_GH_DIRECTORY}/gh"
          echo "path=${TRUSTED_GH_DIRECTORY}/gh" >> "${GITHUB_OUTPUT}"

      - name: Re-verify provenance and require the stable TCB blocker
        id: verify-attestation
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/blocked-windows-handoff-candidate
          TRUSTED_LINUX_EVIDENCE_DIRECTORY: ${{ runner.temp }}/trusted-linux-candidate-evidence
          TRUSTED_GH_PATH: ${{ steps.trusted-gh.outputs.path }}
          VERSION: ${{ needs.linux-images.outputs.version }}
        run: |
          set -euo pipefail
          release_candidate="${VERSION}-${GITHUB_SHA:0:12}"
          evidence_directory="${RUNNER_TEMP}/blocked-candidate-root-attestation"
          test ! -e "${evidence_directory}"
          mkdir "${evidence_directory}"
          policy_result="${evidence_directory}/attestation-policy-result.json"
          set +e
          python scripts/acceptance/verify_candidate_attestation.py \
            --candidate-root "${CANDIDATE_DIRECTORY}/candidate-root.v1.json" \
            --bundle "${ATTESTATION_BUNDLE}" \
            --trusted-gh-path "${TRUSTED_GH_PATH}" \
            --trusted-linux-evidence-directory "${TRUSTED_LINUX_EVIDENCE_DIRECTORY}" \
            --schema "${GITHUB_WORKSPACE}/docs/contracts/candidate-root.v1.schema.json" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-ref "${GITHUB_REF}" \
            --commit "${GITHUB_SHA}" \
            --product-version "${VERSION}" \
            --release-candidate "${release_candidate}" \
            > "${evidence_directory}/unexpected-success.json" \
            2> "${policy_result}"
          verifier_status=$?
          set -e
          if [[ "${verifier_status}" -ne 1 ]]; then
            echo "The blocked attestation verifier returned an unexpected status." >&2
            exit 1
          fi
          POLICY_RESULT="${policy_result}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["POLICY_RESULT"]).read_text(encoding="utf-8"))
          if result != {
              "code": "TRUSTED_ATTESTATION_VERIFIER_TCB_NOT_IMPLEMENTED",
              "detail": result.get("detail"),
              "ready": False,
              "release_approved": False,
          } or not str(result["detail"]).startswith(
              "TRUSTED_ATTESTATION_VERIFIER_TCB_NOT_IMPLEMENTED:"
          ):
              raise SystemExit("attestation verifier did not fail with the fixed TCB blocker")
          PY
          test ! -s "${evidence_directory}/unexpected-success.json"
          unlink "${evidence_directory}/unexpected-success.json"
          cp \
            "${CANDIDATE_DIRECTORY}/candidate-root.v1.json" \
            "${evidence_directory}/candidate-root.v1.json"
          cp "${ATTESTATION_BUNDLE}" "${evidence_directory}/candidate-root.attestation.json"
          python scripts/acceptance/trusted_gh_cli.py metadata \
            --output "${evidence_directory}/trusted-gh-cli-lock.json"
          echo "evidence_directory=${evidence_directory}" >> "${GITHUB_OUTPUT}"

      - name: Upload the canonical blocked candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocked-attested-windows-candidate-${{ needs.linux-images.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/blocked-windows-handoff-candidate
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload the blocked candidate-root attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocked-candidate-root-attestation-${{ needs.linux-images.outputs.artifact_suffix }}
          path: ${{ steps.verify-attestation.outputs.evidence_directory }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
