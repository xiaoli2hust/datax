title = "DataX Enterprise Studio secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Two published ULID-shaped HTTP idempotency examples are fixed non-secret values."
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''^docs/05_API接口与前后端契约\.md$''']
regexes = ['''^(?:01J43MRE4Q3W8FNF4PMY90M4W4|01J43MRF4Q3W8FNF4PMY90M4W5)$''']

[[allowlists]]
description = "Nine fixed test-only idempotency identifiers are not credentials."
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = [
  '''^backend/tests/test_core_control_plane\.py$''',
  '''^backend/tests/test_governance\.py$''',
  '''^backend/tests/test_recovery_control_plane\.py$''',
]
regexes = ['''^(?:no-gate-execution-001|approve-policy-self-001|approve-policy-sensitive-001|approve-policy-sensitive-002|approve-policy-revise-001|revoke-target-001|execution-draining-001|execution-revoked-001|execution-verify-cancel-001|cancel-verifying-001)$''']

[[allowlists]]
description = "Pinned upstream TDengine integration fixture uses its documented test credential."
condition = "AND"
targetRules = ["curl-auth-header"]
paths = [
  '''^third_party/alibaba-datax/tdenginewriter/src/test/resources/incremental_sync/clean_env\.sh$''',
]
regexes = ['''^cm9vdDp0YW9zZGF0YQ==$''']
