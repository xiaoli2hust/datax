    SourceQuiescenceConfirmation:
      type: object
      additionalProperties: false
      description: 操作员声明源表从运行前检查开始到独立 oracle 完成始终停止业务写入；actor 来自认证上下文，V1 只定义 confirmed/confirmed_at/note，不虚构过期或撤回生命周期。核验前后指纹不变是必要证据，但该声明和指纹都不等于数据库一致性快照，也不能证明未报告或瞬时后回滚的写入从未发生。
      required: [confirmed, confirmed_at]
      properties:
        confirmed:
          const: true
        confirmed_at:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: [string, 'null']
          maxLength: 500
    TargetExclusivityConfirmation:
      type: object
      additionalProperties: false
      description: Operator/DBA 作出的有版本、有限有效期的目标平台外独占声明；这是人工前提和报告义务，不是平台技术锁，也不能证明未报告或已经回滚的外部 DML/DDL 从未发生。语义 validator 必须确认 valid_until 晚于 confirmed_at。
      required: [statement_version, confirmed, confirmed_at, valid_until, responsible_party]
      properties:
        statement_version:
          const: '1.0'
        confirmed:
          const: true
        confirmed_at:
          $ref: '#/components/schemas/Timestamp'
        valid_until:
          $ref: '#/components/schemas/Timestamp'
          description: 声明的有限截止时间；要形成 PASSED，必须覆盖 target_result.snapshot_finished_at。
        responsible_party:
          type: string
          enum: [OPERATOR, DBA]
        note:
          type: [string, 'null']
          maxLength: 500
    TargetExclusivityRevocationRequest:
      type: object
      additionalProperties: false
      description: Operator/Admin 在获知平台外目标独占窗口被撤回或破坏时提交的不可抵赖报告；系统从原 Execution 关联确认摘要和目标命名空间。
      required: [statement_version, responsible_party, reason, reported_at]
      properties:
        statement_version:
          const: '1.0'
        responsible_party:
          type: string
          enum: [OPERATOR, DBA]
          description: 必须与原 Execution 固化的目标独占确认责任类型一致；服务端不得信任请求覆盖原值。
        reason:
          type: string
          enum:
            - OPERATOR_REVOKED
            - DBA_REVOKED
            - EXTERNAL_DML_DDL_REPORTED
            - CHANGE_FREEZE_BROKEN
        reported_at:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: [string, 'null']
          maxLength: 500
    RemediationConfirmation:
      description: 非成功执行后由 Operator/目标所有者对必要外部处置作出的处置确认（remediation confirmation）；无需清理时必须如实记录理由。无论是否执行清理，都不能替代 Worker 的目标空表复检。
      oneOf:
        - type: object
          additionalProperties: false
          title: 已清理或重建目标
          required: [action, cleanup_performed, reason, confirmed_at]
          properties:
            action:
              type: string
              enum: [CLEANED_TARGET, RECREATED_TARGET]
            cleanup_performed:
              const: true
            reason:
              type: string
              minLength: 1
              maxLength: 1000
            confirmed_at:
              $ref: '#/components/schemas/Timestamp'
        - type: object
          additionalProperties: false
          title: 经判断无需清理
          required: [action, cleanup_performed, reason, confirmed_at]
          properties:
            action:
              const: NO_CLEANUP_REQUIRED
            cleanup_performed:
              const: false
            reason:
              type: string
              minLength: 1
              maxLength: 1000
            confirmed_at:
              $ref: '#/components/schemas/Timestamp'
        - type: object
          additionalProperties: false
          title: 其他外部处置
          required: [action, cleanup_performed, reason, confirmed_at]
          properties:
            action:
              const: OTHER_EXTERNAL_ACTION
            cleanup_performed:
              type: boolean
            reason:
              type: string
              minLength: 1
              maxLength: 1000
            confirmed_at:
              $ref: '#/components/schemas/Timestamp'
    TargetEmptyEvidence:
      type: object
      additionalProperties: false
      description: >-
        Worker 在持有同目标活动锁后、启动 DataX 前执行受控只读查询产生的证据。
        evidence_hash 固定为
        SHA-256(UTF8("DXTARGETEMPTYv1\n") ||
        RFC8785(evidence_without_evidence_hash))；服务端必须重算且不能信任调用方自报。
      required:
        - result
        - checked_at
        - observed_row_count
        - target_datasource_revision_id
        - target_endpoint_policy_revision_id
        - target_namespace_id
        - physical_table_identity_hash
        - connection_evidence_id
        - evidence_hash
      properties:
        result:
          const: EMPTY
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        observed_row_count:
          const: 0
        target_datasource_revision_id:
          $ref: '#/components/schemas/Uuid'
        target_endpoint_policy_revision_id:
          $ref: '#/components/schemas/Uuid'
        target_namespace_id:
          $ref: '#/components/schemas/Uuid'
        physical_table_identity_hash:
          $ref: '#/components/schemas/Sha256'
        connection_evidence_id:
          $ref: '#/components/schemas/Uuid'
        evidence_hash:
          allOf:
            - $ref: '#/components/schemas/Sha256'
          description: 对排除 evidence_hash 后的完整证据对象按 DXTARGETEMPTYv1 域分离前像重算。
    TargetCopyLockSummary:
      type: object
      additionalProperties: false
      description: TargetNamespace 的复制互斥事实；数据库部分唯一索引覆盖 RESERVED/ACTIVE/RECOVERY_REQUIRED。RESERVED 在 API 创建 QUEUED 时原子产生，Worker 领取时转 ACTIVE 并分配 fence。
      required:
        - target_namespace_id
        - state
        - reserved_at
        - activated_at
        - released_at
        - fence_epoch
      properties:
        target_namespace_id:
          $ref: '#/components/schemas/Uuid'
        state:
          type: string
          enum: [RESERVED, ACTIVE, RECOVERY_REQUIRED, RELEASED]
        reserved_at:
          $ref: '#/components/schemas/Timestamp'
        activated_at:
          $ref: '#/components/schemas/NullableTimestamp'
        released_at:
          $ref: '#/components/schemas/NullableTimestamp'
        fence_epoch:
          type: [integer, 'null']
          minimum: 1
      allOf:
        - if:
            properties:
              state:
                const: RESERVED
            required: [state]
          then:
            properties:
              activated_at:
                type: 'null'
              released_at:
                type: 'null'
              fence_epoch:
                type: 'null'
        - if:
            properties:
              state:
                enum: [ACTIVE, RECOVERY_REQUIRED]
            required: [state]
          then:
            properties:
              activated_at:
                $ref: '#/components/schemas/Timestamp'
              released_at:
                type: 'null'
              fence_epoch:
                type: integer
                minimum: 1
        - if:
            properties:
              state:
                const: RELEASED
            required: [state]
          then:
            properties:
              released_at:
                $ref: '#/components/schemas/Timestamp'
            oneOf:
              - properties:
                  activated_at:
                    type: 'null'
                  fence_epoch:
                    type: 'null'
              - properties:
                  activated_at:
                    $ref: '#/components/schemas/Timestamp'
                  fence_epoch:
                    type: integer
                    minimum: 1
    ExecutionRuntimeSnapshot:
      type: object
      additionalProperties: false
      description: 不含连接串和密钥的安全运行快照；领取事务提交后，由匹配 fence 的 STARTING Attempt 完成真实 DNS/JDBC/Schema/目标空表 preflight 时、启动 DataX 前一次性固定。
      required:
        - job_spec_hash
        - source_schema_hash
        - target_schema_hash
        - source_datasource_revision_id
        - target_datasource_revision_id
        - source_endpoint_policy_revision_id
        - target_endpoint_policy_revision_id
        - source_physical_endpoint_identity_id
        - target_namespace
        - transfer_policy_scope_hash
        - source_secret_version
        - target_secret_version
        - source_secret_envelope_id
        - target_secret_envelope_id
        - datax_release
        - runtime_sha256
        - reader_plugin
        - reader_plugin_sha256
        - writer_plugin
        - writer_plugin_sha256
        - source_consistency_mode
        - target_precondition
        - write_semantics
        - duplicate_policy
        - partial_write_policy
        - source_quiescence_confirmed_by
        - source_quiescence_accepted_at
        - target_exclusivity_confirmed_by
        - target_exclusivity_responsible_party
        - target_exclusivity_accepted_at
        - target_exclusivity_statement_version
        - target_exclusivity_valid_until
        - target_exclusivity_confirmation_sha256
        - target_empty_evidence
        - target_lock_key_hash
        - target_fence_epoch
        - verification_oracle_schema_version
      properties:
        job_spec_hash:
          $ref: '#/components/schemas/Sha256'
        source_schema_hash:
          $ref: '#/components/schemas/Sha256'
        target_schema_hash:
          $ref: '#/components/schemas/Sha256'
        source_datasource_revision_id:
          $ref: '#/components/schemas/Uuid'
        target_datasource_revision_id:
          $ref: '#/components/schemas/Uuid'
        source_endpoint_policy_revision_id:
          $ref: '#/components/schemas/Uuid'
        target_endpoint_policy_revision_id:
          $ref: '#/components/schemas/Uuid'
        source_physical_endpoint_identity_id:
          $ref: '#/components/schemas/Uuid'
        target_namespace:
          $ref: '#/components/schemas/TargetNamespace'
        transfer_policy_scope_hash:
          $ref: '#/components/schemas/Sha256'
        source_secret_version:
          type: integer
          minimum: 1
        target_secret_version:
          type: integer
          minimum: 1
        source_secret_envelope_id:
          $ref: '#/components/schemas/Uuid'
          description: 非秘密 Envelope 版本身份；不返回 encrypted_dek 或 KEK 材料。
        target_secret_envelope_id:
          $ref: '#/components/schemas/Uuid'
          description: 非秘密 Envelope 版本身份；不返回 encrypted_dek 或 KEK 材料。
        datax_release:
          const: datax_v202309
        runtime_sha256:
          $ref: '#/components/schemas/Sha256'
        reader_plugin:
          type: string
          enum: [mysqlreader, postgresqlreader]
        reader_plugin_sha256:
          $ref: '#/components/schemas/Sha256'
        writer_plugin:
          type: string
          enum: [mysqlwriter, postgresqlwriter]
        writer_plugin_sha256:
          $ref: '#/components/schemas/Sha256'
        source_consistency_mode:
          const: OPERATOR_QUIESCED
        target_precondition:
          const: EMPTY_AND_VERIFIABLE
        write_semantics:
