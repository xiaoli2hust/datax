            - running
            - succeeded
            - failed
            - timed_out
            - lost
            - canceled
            - unresolved_failures
        resource:
          type: string
          enum: [JOBS, EXECUTIONS]
        path:
          type: string
          pattern: '^/api/v1/projects/[0-9a-fA-F-]+/(jobs|executions)$'
        filters:
          type: object
          additionalProperties: false
          required:
            - from
