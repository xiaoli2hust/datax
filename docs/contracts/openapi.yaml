  /jobs/{job_id}/executions:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Executions]
      operationId: createExecution
      summary: 对明确的已发布 JobVersion 发起一次性离线全量复制
      description: |
        客户端必须提交源端静默确认，以及 Operator/DBA 对目标端排他窗口的有版本、有限期确认；
        后者承诺从 Worker 最后一次空表观察直到 oracle 的目标一致性读事务完成都没有平台外
        DML/DDL；已过期或已撤回的声明 fail closed，oracle 目标快照结束时间不得晚于
        valid_until。人工确认不等于平台技术锁，也不能证明未报告或已回滚的外部写从未发生。
        API 在同一事务中持久化 QUEUED 请求并为
        TargetNamespace 创建 TargetCopyLock=RESERVED；部分唯一索引覆盖
        RESERVED/ACTIVE/RECOVERY_REQUIRED。同一目标的第二个不同幂等键请求由 API 返回
        409 TARGET_ACTIVE_EXECUTION，不会创建第二个 QUEUED。Worker 领取时原子把 RESERVED
        转为 ACTIVE，并创建 Attempt/fence、固定凭据版本，
        重新检查 Schema、ACTIVE TransferPolicy scope_hash 及全部 mapping 子集关系，并以
        只读查询生成 target_empty_evidence。
        客户端声明不能代替平台实测目标为空。
        Worker 领取事务提交前失败必须整体回滚为 QUEUED+RESERVED，且无 Attempt/fence；
        事务一旦提交，
        非唯一成功终态不得回 QUEUED、复用 Attempt 或自动重新入队。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionCreate'
            example:
              job_version_id: b64006fc-5a22-4e48-a0bd-f9cb1440031f
              source_quiescence_confirmation:
                confirmed: true
                confirmed_at: '2026-07-30T02:39:30Z'
                note: 已暂停订单表写入，保持至核验结束
              target_exclusivity_confirmation:
                statement_version: '1.0'
                confirmed: true
                confirmed_at: '2026-07-30T02:39:35Z'
                valid_until: '2026-07-30T06:39:35Z'
                responsible_party: DBA
                note: 已冻结目标表平台外 DML/DDL，保持至目标核验快照事务完成
      responses:
        '202':
          description: 已持久化为 QUEUED
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/CapacityAdmissionBlocked'

  /executions/{execution_id}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: getExecution
      summary: 获取执行状态与摘要
      responses:
        '200':
          description: 执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /executions/{execution_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [Executions]
      operationId: cancelExecution
      summary: 创建取消请求
      description: |
        API 不直接推进 Execution 状态。未领取的 QUEUED + PENDING CancelRequest 由
        reconciler 收敛为 CANCELED/NONE/NOT_STARTED，并把 RESERVED TargetCopyLock 释放为
        RELEASED；不创建 Attempt/fence 或 RecoveryGate。已经领取的执行由 Worker 确认并写
        CANCEL_REQUESTED，终止后把锁转为 RECOVERY_REQUIRED 并进入恢复门禁。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelExecutionRequest'
      responses:
        '202':
          description: 取消请求已持久化
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /executions/{execution_id}/target-exclusivity/revoke:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [Executions]
      operationId: revokeExecutionTargetExclusivity
      summary: 撤回目标外部独占声明或报告窗口已被破坏
      description: |
        Operator/Admin 在获知目标平台外 DML/DDL、冻结失效或 DBA 撤回承诺时必须立即调用。
        API 原子保存撤回事实并写 TARGET_EXCLUSIVITY_REVOKED 审计；平台不能自行证明所有
        外部写入，因此本接口是 fail-closed 的报告通道。未领取 QUEUED 由 reconciler
        收敛为 CANCELED/NONE/NOT_STARTED 并释放 RESERVED；已领取执行终止进程并进入恢复
        门禁；已在 VERIFYING 的 oracle 形成 INCONCLUSIVE/TARGET_EXCLUSIVITY_BROKEN。
        已终态执行返回 409，不改写历史结论。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetExclusivityRevocationRequest'
      responses:
        '202':
          description: 撤回事实已持久化
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Execution'
                  - properties:
                      target_exclusivity_status:
                        const: REVOKED
                      target_exclusivity_revoked_at:
                        $ref: '#/components/schemas/Timestamp'
                      target_exclusivity_revocation_reason:
                        type: string
                        enum:
                          - OPERATOR_REVOKED
                          - DBA_REVOKED
                          - EXTERNAL_DML_DDL_REPORTED
                          - CHANGE_FREEZE_BROKEN
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /executions/{execution_id}/recovery:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: getExecutionRecoveryGate
      summary: 获取失败执行的人工恢复门禁
      description: 仅已领取且未以 SUCCEEDED/CONFIRMED/PASSED 结束的 Execution 才有 gate；未领取即取消的 CANCELED 不适用。
      responses:
        '200':
          description: 恢复门禁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryGate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [Executions]
      operationId: submitExecutionRemediation
      summary: 提交处置确认（remediation confirmation）并排队 RecoveryProbe
      description: |
        已经领取且 TargetCopyLock 已从 RESERVED 转为 ACTIVE，随后进入 RECOVERY_REQUIRED 的
        FAILED、TIMED_OUT、CANCELED 或 LOST 执行再次执行前需要该门禁；未领取即取消的
        CANCELED 没有 Attempt/fence/gate，RESERVED 锁已释放，
        recovery 接口返回 RECOVERY_GATE_NOT_APPLICABLE。
        即使 data_effect=NONE 也必须如实提交处置确认；无需清理时使用
        action=NO_CLEANUP_REQUIRED、cleanup_performed=false 并说明 reason。任何声明都不能
        跳过 Worker 空表复检。
        API 只持久化 REMEDIATION_SUBMITTED；Worker 取得目标锁后生成 target_empty_evidence，
        通过才写 VERIFIED。平台不代替目标表所有者执行 truncate、delete、drop 或建表。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationConfirmation'
            example:
              action: NO_CLEANUP_REQUIRED
              cleanup_performed: false
              reason: DataX 启动前即失败，目标所有者确认无需执行清理；仍等待平台空表复检
              confirmed_at: '2026-07-30T03:00:00Z'
      responses:
        '202':
          description: 已提交处置确认并创建独立 RecoveryProbe 事实
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverySubmission'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /recovery-probes/{recovery_probe_id}:
    parameters:
      - name: recovery_probe_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [Executions]
      operationId: getRecoveryProbe
      summary: 获取恢复空表探针状态
      description: RecoveryProbe 是独立 PostgreSQL 事实队列，使用自身 Attempt、lease 和 fence；不启动 DataX。
      responses:
        '200':
          description: RecoveryProbe 安全摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryProbe'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /executions/{execution_id}/rerun:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [Executions]
      operationId: rerunExecution
      summary: 恢复后使用原 JobVersion 再次执行
      description: |
        只允许对已经领取、存在 RecoveryGate 且状态为 FAILED、TIMED_OUT、CANCELED 或
        LOST 的原执行恢复。未领取即取消的 CANCELED 不走该路径。
        原执行无论 data_effect 当前判断为何，都必须完成必要外部处置并如实提交处置确认；无需
        清理时不得虚假声称清理，但仍须关联 RecoveryGate
        已由 Worker 空表复检为 VERIFIED；状态判断不能代替复检。
        客户端还须再次确认源端静默，并提交有版本、有限有效期且未撤回的目标排他声明；
        Worker 在新执行启动前仍会取得同目标活动锁并再次实测目标为空，oracle 目标快照结束时间不得晚于 valid_until。
        不会自动选择最新 JobVersion，也不提供自动重试。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRerunCreate'
            example:
              source_quiescence_confirmation:
                confirmed: true
                confirmed_at: '2026-07-30T03:10:00Z'
                note: 已再次暂停源表写入
              target_exclusivity_confirmation:
                statement_version: '1.0'
                confirmed: true
                confirmed_at: '2026-07-30T03:10:05Z'
                valid_until: '2026-07-30T07:10:05Z'
                responsible_party: OPERATOR
                note: 已再次冻结目标表平台外 DML/DDL
              recovery_gate_id: 44444444-4444-4444-8444-444444444444
      responses:
        '202':
          description: 新 Execution
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CapacityAdmissionBlocked'

  /executions/{execution_id}/logs:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: getExecutionLogs
      summary: 用不透明游标读取脱敏日志
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/LogLimit'
        - name: stream
          in: query
          schema:
            type: string
            enum: [STDOUT, STDERR, SYSTEM]
      responses:
        '200':
          description: 日志页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

  /executions/{execution_id}/logs/download:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: downloadExecutionLogs
      summary: 下载服务端持久化的脱敏原序日志
      description: |
        所有项目成员可读。响应由服务端从脱敏 LogChunk 组装并产生
        EXECUTION_LOG_EXPORTED 审计。V1 脱敏后未压缩大小上限为 100 MiB；
        单次响应超限返回 413。若日志采集阶段已因存储上限截断，服务端必须通过
        X-Log-Truncated、X-Log-Incomplete、四类字节计数、X-Log-Gap-Count 和
        X-Log-Truncation-Reason 明示；cursor 和下载均无法恢复已丢弃字节，
        不得称为完整日志。
      responses:
        '200':
          description: UTF-8 脱敏日志
          headers:
            Content-Disposition:
              description: attachment 文件名
              schema:
                type: string
            X-Log-Redaction-Version:
              description: 脱敏规则版本
              schema:
                type: string
                maxLength: 32
            X-Content-SHA256:
              description: 响应正文 SHA-256
              schema:
                $ref: '#/components/schemas/Sha256'
            X-Log-Truncated:
              description: true 表示采集阶段已有字节因明确策略被丢弃
              schema:
                type: boolean
            X-Log-Incomplete:
              description: true 表示存在任一显式 LogGap；即使 truncated=false 也可能不完整
              schema:
                type: boolean
            X-Log-Raw-Received-Bytes:
              description: 截止响应时脱敏前仅计数的输入字节；原文不持久化
              schema:
                type: integer
                minimum: 0
            X-Log-Redacted-Received-Bytes:
              description: 脱敏后、截断或保留决策前的字节数
              schema:
                type: integer
                minimum: 0
            X-Log-Stored-Bytes:
              description: 实际持久化并用于本次下载的脱敏字节数
              schema:
                type: integer
                minimum: 0
            X-Log-Dropped-Bytes:
              description: 因日志存储上限或单行上限未持久化的字节数
              schema:
                type: integer
                minimum: 0
            X-Log-Gap-Count:
              description: 已登记的 LogGap 数；详细缺口通过日志分页响应读取
              schema:
                type: integer
                minimum: 0
            X-Log-Truncation-Reason:
              description: 截断原因；未截断时为 NONE
              schema:
                type: string
                enum: [NONE, EXECUTION_LIMIT, LINE_LIMIT, RING_EVICTION]
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /projects/{project_id}/audit-events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: 分页列出追加式审计事件
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: action
          in: query
          schema:
            type: string
            maxLength: 64
        - name: outcome
          in: query
          schema:
            type: string
            enum: [SUCCEEDED, DENIED, FAILED]
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 审计页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit-events:
    get:
      tags: [Audit]
      operationId: listOrganizationAuditEvents
      summary: 跨项目分页列出组织审计
      description: 仅组织级 Admin。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
            maxLength: 64
        - name: outcome
          in: query
          schema:
            type: string
            enum: [SUCCEEDED, DENIED, FAILED]
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 审计页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /health/live:
    get:
      tags: [Health]
      operationId: liveness
      summary: 经唯一 loopback web 入口检查 backend 进程存活
      description: |
        仅供 Windows launcher 和本机页面通过 127.0.0.1:17860 调用；不检查外部依赖，
        不得暴露 Windows 路径、容器地址、数据库 DSN、环境变量或 secret。
      security: []
      responses:
        '200':
          description: 经 web 反向代理的 backend 进程可响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      summary: PostgreSQL、named volumes、dispatcher、Worker/Linux Runtime 与独立 oracle 就绪检查
      description: |
        仅供 Windows launcher 和本机页面通过 127.0.0.1:17860 调用。Docker Desktop、
        WSL2、虚拟化、宿主端口和 ACL 由 launcher 在 Compose 启动前检查，不在此响应中
        伪装成 backend 能证明的状态。
      security: []
      responses:
        '200':
          description: |
            本机管理平面可用。status=UP 时可接收新执行；status=DEGRADED 时仍可登录、
            配置和查看诊断，但执行入口必须按组件状态失败关闭，不得把 DEGRADED 显示为
            “可运行任务”。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: PostgreSQL、迁移、API 日志卷或审计链等管理平面关键组件不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: des_refresh
      description: V1 loopback HTTP 使用 HttpOnly、SameSite=Strict、Path=/api/v1/auth 且无 Domain；若未来改为受信 loopback HTTPS 必须增加 Secure。

  headers:
    RequestId:
      description: 服务端请求关联 UUID
      schema:
        type: string
        format: uuid
    ETag:
      description: 弱 ETag，值为 W/"row_version"
      schema:
        type: string
        pattern: '^W/"[1-9][0-9]*"$'
    IdempotencyReplayed:
      description: true 表示返回 24 小时内首次请求结果
      schema:
        type: boolean

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DatasourceId:
      name: datasource_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: 服务端生成的不透明游标
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LogLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^W/"[1-9][0-9]*"$'

  responses:
    BadRequest:
      description: 请求或 cursor 无效
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 未认证、凭证无效或 token 到期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 无权限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在或对当前主体不可见
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 版本、幂等、状态或唯一约束冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: 日志已按保留策略删除
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 脱敏日志超过 V1 单次导出上限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: 请求或业务语义校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DatasourceConnectionFailed:
      description: 数据源连接、认证或元数据读取失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Worker、Runtime 或关键依赖未就绪
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CapacityAdmissionBlocked:
      description: 普通新 Execution 因持久容量准入门禁被拒绝
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CapacityAdmissionProblem'

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    NullableUuid:
      oneOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Role:
      type: string
      enum: [ADMIN, DEVELOPER, OPERATOR, VIEWER]
    ProjectRole:
      type: string
      enum: [DEVELOPER, OPERATOR, VIEWER]
    Engine:
      type: string
      enum: [MYSQL_8, POSTGRESQL_15]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    DatasourceStatus:
      type: string
      enum: [ACTIVE, DISABLED, DELETED]
    JobStatus:
      type: string
      enum: [DRAFT, VALID, PUBLISHED, ARCHIVED]
    ProcessState:
      type: string
      enum:
        - QUEUED
        - STARTING
        - RUNNING
        - VERIFYING
        - SUCCEEDED
        - FAILED
        - TIMED_OUT
        - CANCEL_REQUESTED
        - CANCELED
        - LOST
    DataEffect:
      type: string
      description: 目标端影响是否已测得，独立于 DataX 进程状态和内容正确性；CONFIRMED 表示影响已测得，测得值可以是 0 行，绝不等于内容核验通过。空源成功仍为 SUCCEEDED/CONFIRMED/PASSED。
      enum: [NONE, POSSIBLE, CONFIRMED, UNKNOWN]
    VerificationState:
      type: string
      description: 独立 oracle 的生命周期；oracle 从未启动时为 NOT_STARTED，即使 DataX 已异常退出；已启动但无法形成结论时才为 INCONCLUSIVE。只有 PASSED 可支持 process_state=SUCCEEDED。
      enum: [NOT_STARTED, VERIFYING, PASSED, FAILED, INCONCLUSIVE]
    FieldError:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
          maxLength: 500
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
        message:
          type: string
          maxLength: 1000
    CapacityAdmissionDetails:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [QUEUE_LIMIT, BACKLOG_LIMIT, DISK_YELLOW, DISK_RED, LOG_BUDGET]
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - instance
        - request_id
        - retryable
        - field_errors
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
        detail:
          type: [string, 'null']
          maxLength: 2000
        instance:
          type: string
          maxLength: 500
        request_id:
          $ref: '#/components/schemas/Uuid'
        retryable:
          type: boolean
        field_errors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          oneOf:
            - $ref: '#/components/schemas/CapacityAdmissionDetails'
            - type: 'null'
    CapacityAdmissionProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [details]
          properties:
            status:
              const: 503
            code:
              const: CAPACITY_ADMISSION_BLOCKED
            details:
              $ref: '#/components/schemas/CapacityAdmissionDetails'

    UserSummary:
      type: object
      additionalProperties: false
      required: [id, email, display_name, must_change_password]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        must_change_password:
          type: boolean
          description: true 时除 refresh/logout/me/change-password 外的业务接口统一返回 PASSWORD_CHANGE_REQUIRED。
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - display_name
        - status
        - must_change_password
        - role_assignments
        - row_version
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum: [ACTIVE, LOCKED, DISABLED]
        must_change_password:
          type: boolean
        role_assignments:
          type: array
          items:
            $ref: '#/components/schemas/ScopedRoles'
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, display_name, temporary_password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        temporary_password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          writeOnly: true
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    UserPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          writeOnly: true
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          writeOnly: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          writeOnly: true
    AuthResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          readOnly: true
        token_type:
          const: Bearer
        expires_in:
          type: integer
          minimum: 60
          example: 900
        user:
          $ref: '#/components/schemas/UserSummary'
    ScopedRoles:
      type: object
      additionalProperties: false
      required: [scope_type, scope_id, roles]
      properties:
        scope_type:
          type: string
          enum: [ORGANIZATION, PROJECT]
        scope_id:
          $ref: '#/components/schemas/Uuid'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
    MeResponse:
      type: object
      additionalProperties: false
      required: [user, role_assignments]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        role_assignments:
          type: array
          items:
            $ref: '#/components/schemas/ScopedRoles'

    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - name
        - slug
        - description
        - status
        - row_version
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]{2,63}$'
        description:
          type: [string, 'null']
          maxLength: 1000
        status:
          $ref: '#/components/schemas/ProjectStatus'
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]{2,63}$'
        description:
          type: [string, 'null']
          maxLength: 1000
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: [string, 'null']
          maxLength: 1000
        status:
          type: string
          enum: [ARCHIVED]
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    Member:
      type: object
      additionalProperties: false
      required: [organization_member_id, user, roles]
      properties:
        organization_member_id:
          $ref: '#/components/schemas/Uuid'
        user:
          $ref: '#/components/schemas/UserSummary'
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    RoleReplaceRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 0
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProjectRole'
    OrganizationRoleReplaceRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 1
          uniqueItems: true
          items:
            const: ADMIN

    DashboardWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
    DashboardJobCounts:
      type: object
      additionalProperties: false
      required: [total, draft, valid, published, archived, executable]
      properties:
        total:
          type: integer
          minimum: 0
        draft:
          type: integer
          minimum: 0
        valid:
          type: integer
          minimum: 0
        published:
          type: integer
          minimum: 0
        archived:
          type: integer
          minimum: 0
        executable:
          type: integer
          minimum: 0
          description: 未归档且至少存在一个 JobVersion
    DashboardExecutionCounts:
      type: object
      additionalProperties: false
      required:
        - QUEUED
        - STARTING
        - RUNNING
        - VERIFYING
        - CANCEL_REQUESTED
        - SUCCEEDED
        - FAILED
        - TIMED_OUT
        - CANCELED
        - LOST
      properties:
        QUEUED:
          type: integer
          minimum: 0
        STARTING:
          type: integer
          minimum: 0
        RUNNING:
          type: integer
          minimum: 0
        VERIFYING:
          type: integer
          minimum: 0
        CANCEL_REQUESTED:
          type: integer
          minimum: 0
        SUCCEEDED:
          type: integer
          minimum: 0
        FAILED:
          type: integer
          minimum: 0
        TIMED_OUT:
          type: integer
          minimum: 0
        CANCELED:
          type: integer
          minimum: 0
        LOST:
          type: integer
          minimum: 0
    DashboardSuccessRate:
      type: object
      additionalProperties: false
      required: [numerator, denominator, ratio]
      properties:
        numerator:
          type: integer
          minimum: 0
          description: process_state=SUCCEEDED 且 verification_state=PASSED
        denominator:
          type: integer
          minimum: 0
          description: process_state=SUCCEEDED + FAILED + TIMED_OUT + LOST；取消不计
        ratio:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: numerator / denominator；denominator=0 时固定为 null。
    DashboardVerificationCounts:
      type: object
      additionalProperties: false
      required: [NOT_STARTED, VERIFYING, PASSED, FAILED, INCONCLUSIVE]
      properties:
        NOT_STARTED:
          type: integer
          minimum: 0
        VERIFYING:
          type: integer
          minimum: 0
        PASSED:
          type: integer
          minimum: 0
        FAILED:
          type: integer
          minimum: 0
        INCONCLUSIVE:
          type: integer
          minimum: 0
    DashboardDataEffectCounts:
      type: object
      additionalProperties: false
      description: CONFIRMED 计数表示目标影响已测得（包含测得 0 行），不表示内容正确；内容正确性必须同时查看 verification_state=PASSED。
      required: [NONE, POSSIBLE, CONFIRMED, UNKNOWN]
      properties:
        NONE:
          type: integer
          minimum: 0
        POSSIBLE:
          type: integer
          minimum: 0
        CONFIRMED:
          type: integer
          minimum: 0
          description: 目标影响已测得的执行数，包括空源成功的 0 行影响。
        UNKNOWN:
          type: integer
          minimum: 0
    DashboardVerifiedRecords:
      type: object
      additionalProperties: false
      description: 只累计 process_state=SUCCEEDED 且 verification_state=PASSED 的独立 oracle 目标行数。
      required: [value, complete, missing_verification_count]
      properties:
        value:
          type: integer
          minimum: 0
        complete:
          type: boolean
        missing_verification_count:
          type: integer
          minimum: 0
    DashboardExecutionItem:
      type: object
      additionalProperties: false
      required:
        - execution_id
        - job_id
        - job_version_id
        - job_name
        - process_state
        - data_effect
        - verification_state
        - queued_at
        - started_at
        - finished_at
        - failure_code
      properties:
        execution_id:
          $ref: '#/components/schemas/Uuid'
        job_id:
          $ref: '#/components/schemas/Uuid'
        job_version_id:
          $ref: '#/components/schemas/Uuid'
        job_name:
          type: string
          minLength: 1
          maxLength: 128
        process_state:
          $ref: '#/components/schemas/ProcessState'
        data_effect:
          $ref: '#/components/schemas/DataEffect'
        verification_state:
          $ref: '#/components/schemas/VerificationState'
        queued_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        failure_code:
          type: [string, 'null']
          maxLength: 64
    DashboardTrendBucket:
      type: object
      additionalProperties: false
      required: [bucket_start, bucket_end, process_counts, verification_counts]
      properties:
        bucket_start:
          $ref: '#/components/schemas/Timestamp'
        bucket_end:
          $ref: '#/components/schemas/Timestamp'
        process_counts:
          $ref: '#/components/schemas/DashboardExecutionCounts'
        verification_counts:
          $ref: '#/components/schemas/DashboardVerificationCounts'
    DashboardRuntime:
      type: object
      additionalProperties: false
      required: [worker_online, runtime_ready, oracle_ready, datax_release, version_match]
      properties:
        worker_online:
          type: boolean
        runtime_ready:
          type: boolean
        oracle_ready:
          type: boolean
        datax_release:
          type: [string, 'null']
          enum: [datax_v202309, null]
        version_match:
          type: boolean
    DashboardDrilldown:
      type: object
      additionalProperties: false
      required: [metric_key, resource, path, filters]
      properties:
        metric_key:
          type: string
          enum:
            - executable_jobs
            - all_executions
            - queued
            - running
            - succeeded
            - failed
            - timed_out
            - lost
            - canceled
            - unresolved_failures
        resource:
          type: string
          enum: [JOBS, EXECUTIONS]
        path:
          type: string
          pattern: '^/api/v1/projects/[0-9a-fA-F-]+/(jobs|executions)$'
        filters:
          type: object
          additionalProperties: false
          required:
            - from
            - to
            - process_states
            - verification_states
            - data_effects
            - exclude_job_status
            - has_published_version
            - unresolved_failure
          properties:
            from:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            to:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            process_states:
              type: array
              maxItems: 10
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ProcessState'
            verification_states:
              type: array
              maxItems: 5
              uniqueItems: true
              items:
                $ref: '#/components/schemas/VerificationState'
            data_effects:
              type: array
              maxItems: 4
              uniqueItems: true
              items:
                $ref: '#/components/schemas/DataEffect'
            exclude_job_status:
              oneOf:
                - $ref: '#/components/schemas/JobStatus'
                - type: 'null'
            has_published_version:
              type: [boolean, 'null']
            unresolved_failure:
              type: [boolean, 'null']
    DashboardResponse:
      type: object
      additionalProperties: false
      required:
        - project_id
        - window
        - job_counts
        - execution_total
        - execution_state_counts
        - verification_state_counts
        - data_effect_counts
        - success_rate
        - unresolved_failure_count
        - verified_records
        - recent_executions
        - recent_failures
        - trend
        - runtime
        - drilldowns
        - generated_at
      properties:
        project_id:
          $ref: '#/components/schemas/Uuid'
        window:
          $ref: '#/components/schemas/DashboardWindow'
        job_counts:
          $ref: '#/components/schemas/DashboardJobCounts'
        execution_total:
