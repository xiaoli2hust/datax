      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        execution_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [PENDING, ACKNOWLEDGED, COMPLETED, REJECTED]
        requested_at:
          $ref: '#/components/schemas/Timestamp'
    LogLine:
      type: object
      additionalProperties: false
      required: [sequence, timestamp, stream, level, message]
      properties:
        sequence:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        stream:
          type: string
          enum: [STDOUT, STDERR, SYSTEM]
        level:
          type: string
          enum: [TRACE, DEBUG, INFO, WARN, ERROR, UNKNOWN]
        message:
          type: string
          maxLength: 16384
    LogPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - eof
        - redaction_rules_version
        - expires_at
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LogLine'
        next_cursor:
          type: string
          minLength: 1
        eof:
          type: boolean
        redaction_rules_version:
          type: string
          maxLength: 32
        expires_at:
          $ref: '#/components/schemas/Timestamp'

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: './audit-event.v1.schema.json'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    ComponentHealth:
      type: object
      additionalProperties: false
      required: [status, code]
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, checked_at, components]
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
        version:
          type: string
          maxLength: 64
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentHealth'
