openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: DataX Enterprise Studio API
  version: 1.2.0
  license:
    name: License pending repository-owner decision
    url: https://github.com/xiaoli2hust/datax/blob/main/README.md
  description: |
    V1 单组织、多项目、安全的一次性离线全量复制控制 API。
    仅支持 MySQL 8/PostgreSQL 15、人工触发、源端静默确认、预存在且实测为空的目标表和 insert-only-once。
    不提供调度、DAG、告警、AI、CDC、自由 SQL、Transformer 或插件安装接口。
    交付形态为 Windows 11 x64 本地工作站；业务 API 仅经 web 反向代理绑定本机
    127.0.0.1:17860，api、worker 和 postgres 不暴露宿主端口。
servers:
  - url: http://127.0.0.1:17860/api/v1
    description: Windows 本地工作站唯一支持入口；不得替换为 0.0.0.0、LAN IP 或公网地址
tags:
  - name: Auth
    description: 本地账号会话与本人密码
  - name: Users
    description: Admin 用户生命周期管理
  - name: Projects
    description: 项目、成员、角色与首页统计
  - name: Plugins
    description: 只读认证插件清单
  - name: SecurityPolicies
    description: Admin 管理的数据端点、使用授权和传输审批
  - name: Datasources
    description: 数据源、凭证测试和 Schema 探测
  - name: Jobs
    description: 任务草稿、校验、预览与不可变版本
  - name: Executions
    description: 人工运行、取消、恢复后再次执行和脱敏日志
  - name: Audit
    description: 项目级与组织级追加式审计
  - name: Health
    description: 仅供本机 launcher/web 使用、无敏感信息的 loopback 存活与就绪检查
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 本地账号登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: operator@example.com
              password: <write-only-password>
      responses:
        '200':
          description: 登录成功；同时设置 HttpOnly refresh cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: des_refresh；HttpOnly、SameSite=Strict、Path=/api/v1/auth、无 Domain。V1 loopback HTTP 不虚假声明 Secure。
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: 旋转 refresh token 并签发 access token
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 刷新成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 旋转后的 des_refresh；属性与登录响应一致
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 幂等撤销调用方持有的本机会话凭证
      description: |
        接受 bearer、refresh cookie 或两者。每个能被密码学验证并精确定位的 session 都会
        被撤销；两者指向不同 session 时分别撤销，避免只删除 cookie 而留下服务器端 refresh
        session。缺失、无效、过期或已撤销凭证同样返回 204，响应始终删除本机 cookie。
      security:
        - bearerAuth: []
        - refreshCookie: []
        - {}
      responses:
        '204':
          description: 已撤销；重复退出同样返回 204
          headers:
            Set-Cookie:
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前用户及作用域角色
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changeOwnPassword
      summary: 修改本人密码并撤销其他 session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 密码已修改；当前 session 保留，其他 session 已撤销
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页列出组织用户
      description: 需要组织级 Admin。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, LOCKED, DISABLED]
      responses:
        '200':
          description: 用户页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: 创建本地用户
      description: 需要 Admin；temporary_password 是 write-only，响应不回显。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 已创建，用户首次登录必须改密
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: 获取用户状态与角色摘要
      description: 需要组织级 Admin。
      responses:
        '200':
          description: 用户
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      operationId: updateUser
      summary: 修改显示名或启用/停用用户
      description: 停用用户会撤销其全部 session。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user_id}/unlock:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: unlockUser
      summary: 解除登录锁定
      description: 需要 Admin；清零失败计数并清空 locked_until。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已解锁
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{user_id}/organization-roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      operationId: replaceOrganizationRoles
      summary: 原子替换组织级 Admin 角色
      description: 需要 Admin；允许空数组撤销，但系统必须至少保留一名有效 Admin。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRoleReplaceRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user_id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: 设置临时密码并撤销全部 session
      description: 需要 Admin；响应不返回临时密码，用户下次登录必须改密。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: 已重置
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: 分页列出当前用户可见项目
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 项目页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      summary: 创建项目
      description: 需要组织级 Admin。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              name: 订单数据集成
              slug: order-integration
              description: 订单离线复制任务
      responses:
        '201':
          description: 已创建
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: 获取项目
      responses:
        '200':
          description: 项目
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: 更新或归档项目
      description: 需要组织级 Admin。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectMembers
      summary: 列出项目成员及角色
      description: 需要 Admin。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成员页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project_id}/members/{user_id}/roles:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Projects]
      operationId: replaceProjectMemberRoles
      summary: 原子替换用户的项目角色
      description: 需要 Admin；角色可多选，权限取并集。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleReplaceRequest'
            example:
              roles: [DEVELOPER, VIEWER]
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/dashboard:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProjectDashboard
      summary: 获取固定时间窗的项目运行概览
      description: |
        所有项目成员可读。Execution 以 queued_at 落入半开区间 [from,to) 统计；
        时间窗最长 31 天。成功率分子为 process_state=SUCCEEDED 且 verification_state=PASSED，口径为该分子 /
        (SUCCEEDED + FAILED + TIMED_OUT + LOST)，分母为 0 时 ratio 为 null。
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 项目概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /plugins:
    get:
      tags: [Plugins]
      operationId: listCertifiedPlugins
      summary: 获取四个只读认证插件 manifest
      responses:
        '200':
          description: 插件 manifest 列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items:
                      $ref: './plugin-manifest.v1.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /endpoint-policies:
    get:
      tags: [SecurityPolicies]
      operationId: listEndpointPolicies
      summary: Admin 分页列出组织数据端点白名单
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 端点策略页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointPolicyPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [SecurityPolicies]
      operationId: createEndpointPolicy
      summary: Admin 创建组织数据端点白名单
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointPolicyCreate'
      responses:
        '201':
          description: 已创建
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /endpoint-policies/{endpoint_policy_id}:
    parameters:
      - name: endpoint_policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [SecurityPolicies]
      operationId: getEndpointPolicy
      summary: Admin 获取端点策略
      responses:
        '200':
          description: 端点策略
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [SecurityPolicies]
      operationId: updateEndpointPolicy
      summary: Admin 更新或停用端点策略
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointPolicyPatch'
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /endpoint-policies/{endpoint_policy_id}/revisions/{revision_id}:
    parameters:
      - name: endpoint_policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: revision_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [SecurityPolicies]
      operationId: getEndpointPolicyRevision
      summary: Admin 获取不可变端点策略修订
      description: 原始 FQDN/IP、CIDR、端口和出口策略属于 Admin-only 配置，不向项目只读角色暴露。
      responses:
        '200':
          description: 不可变 EndpointPolicyRevision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointPolicyRevision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /physical-endpoint-identities/{physical_endpoint_identity_id}:
    parameters:
      - name: physical_endpoint_identity_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [SecurityPolicies]
      operationId: getPhysicalEndpointIdentity
      summary: Admin 获取不可变物理端点身份
      description: 只返回加盐哈希和脱敏验证证据，不返回引擎原生 server UUID/system identifier。
      responses:
        '200':
          description: PhysicalEndpointIdentity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalEndpointIdentity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /target-namespaces/{target_namespace_id}:
    parameters:
      - name: target_namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [SecurityPolicies]
      operationId: getTargetNamespace
      summary: Admin 获取不可变物理目标表命名空间
      responses:
        '200':
          description: TargetNamespace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetNamespace'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /endpoint-connection-evidence/{connection_evidence_id}:
    parameters:
      - name: connection_evidence_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [SecurityPolicies]
      operationId: getEndpointConnectionEvidence
      summary: Admin 获取不可变端点连接证据
      description: |
        返回一次 TEST/METADATA/PREFLIGHT/DATAX/ORACLE/RECOVERY_PROBE 连接的 DNS、
        selected/peer IP 与 egress 决策证据。该响应包含网络定位信息，仅 Admin 可读；
        项目成员响应只返回 connection_evidence_id。
      responses:
        '200':
          description: EndpointConnectionEvidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointConnectionEvidence'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project_id}/datasources:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Datasources]
      operationId: listDatasources
      summary: 分页列出项目数据源
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: engine
          in: query
          schema:
            $ref: '#/components/schemas/Engine'
      responses:
        '200':
          description: 数据源页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourcePage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Datasources]
      operationId: createDatasource
      summary: 创建数据源并加密凭证
      description: 仅 Admin；host/port 必须命中 ACTIVE EndpointPolicy，运行时仍需 DNS 重解析和出口策略复检。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceCreate'
            example:
              name: 订单库
              description: 只读订单源
              endpoint_policy_id: 33333333-3333-4333-8333-333333333333
              engine: MYSQL_8
              host: mysql.internal.example
              port: 3306
              database_name: sales
              default_schema: sales
              username: datax_reader
              password: <write-only-password>
              ssl_mode: VERIFY_FULL
      responses:
        '201':
          description: 已创建；响应不包含 password
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceAdminDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /datasources/{datasource_id}:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
    get:
      tags: [Datasources]
      operationId: getDatasource
      summary: 获取项目可读的数据源脱敏摘要
      description: 对所有项目角色使用同一最小披露形状；不返回真实 host、port、database_name、default_schema 或 username。
      responses:
        '200':
          description: 数据源
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceRedactedSummary'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Datasources]
      operationId: updateDatasource
      summary: 更新数据源或轮换密码
      description: |
        password 缺失表示安全复用当前 ACTIVE secret；null 或空字符串无效。任一非秘密连接
        定位字段变化时，服务端必须先按当前 ACTIVE EndpointPolicyRevision 完成 DNS、精确
        出口、TLS/认证与物理实例身份探针，再新增不可变 DatasourceRevision 并原子切换
        current_revision_id；探针失败时整次 PATCH 失败且不能保存新修订或新 secret。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourcePatch'
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceAdminDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Datasources]
      operationId: deleteDatasource
      summary: 软删除数据源
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: 已软删除
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /datasources/{datasource_id}/admin-detail:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
    get:
      tags: [Datasources]
      operationId: getDatasourceAdminDetail
      summary: Admin 获取数据源连接配置详情
      description: |
        仅 Admin 可读取真实 host、port、database_name、default_schema 和 username。
        响应仍不得包含密码、密文、nonce、DEK、完整 JDBC URL 或可直接执行的 DataX 配置。
      responses:
        '200':
          description: Admin-only 数据源详情
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceAdminDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /datasources/{datasource_id}/revisions/{revision_id}:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
      - name: revision_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [Datasources]
      operationId: getDatasourceRevision
      summary: Admin 获取不可变数据源修订原始详情
      description: 真实连接定位字段为 Admin-only；项目只读角色使用 DatasourceRedactedSummary。
      responses:
        '200':
          description: 数据源修订；永不包含密码、secret ID 或连接串
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceRevisionAdminDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /datasources/{datasource_id}/credential-secrets:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
    get:
      tags: [Datasources]
      operationId: listDatasourceCredentialSecrets
      summary: Admin 列出凭据版本的非秘密生命周期元数据
      description: 不返回 secret ID、密文、nonce、Envelope 密文或 KEK 材料。
      responses:
        '200':
          description: 凭据版本摘要
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CredentialSecretSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /datasources/{datasource_id}/credential-secrets/{secret_version}/status:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
      - name: secret_version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Datasources]
      operationId: changeDatasourceCredentialSecretStatus
      summary: Admin 退役或紧急撤销凭据版本
      description: |
        ACTIVE 可转为 RETIRED、REVOKED 或 COMPROMISED；REVOKED/COMPROMISED
        必须 fail closed，并为引用该版本的非终态 Execution/RecoveryProbe 建立紧急终止事实。
        该接口不能把任何历史版本重新变为 ACTIVE；配置新密码应走数据源更新接口并创建新版本。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialSecretStatusChange'
      responses:
        '200':
          description: 更新后的非秘密生命周期摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSecretSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /datasources/{datasource_id}/grants:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
    get:
      tags: [SecurityPolicies]
      operationId: listDatasourceUsageGrants
      summary: Admin 分页列出数据源使用授权
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 授权页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceUsageGrantPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /datasources/{datasource_id}/grants/{member_id}:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
      - name: member_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    put:
      tags: [SecurityPolicies]
      operationId: replaceDatasourceUsageGrants
      summary: Admin 原子替换成员的源端/目标端使用授权
      description: 空 usages 撤销全部授权；授权不能绕过项目成员关系、EndpointPolicy 或 TransferPolicy。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceUsageGrantReplace'
      responses:
        '200':
          description: 当前有效授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceUsageGrantPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /datasources/{datasource_id}/test:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
    post:
      tags: [Datasources]
      operationId: testDatasource
      summary: 使用已保存凭证执行受限连接测试
      description: 仅 Admin；连接前必须复检 ACTIVE EndpointPolicy、DNS 解析结果和网络出口限制。
      responses:
        '200':
          description: 测试已完成；连接失败通过 status=FAILED 表达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceTestResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /datasources/{datasource_id}/schema/tables:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
    get:
      tags: [Datasources]
      operationId: listDatasourceTables
      summary: 读取表和列元数据
      description: Admin 可按任一用途检查；Developer 必须声明 SOURCE_USE 或 TARGET_USE，服务端按该精确用途授权，cursor 同时绑定用途。
      parameters:
        - name: usage
          in: query
          required: true
          schema:
            type: string
            enum: [SOURCE_USE, TARGET_USE]
        - name: schema_name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: table_name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 表元数据页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSchemaPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DatasourceConnectionFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/{project_id}/transfer-policies:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [SecurityPolicies]
      operationId: listTransferPolicies
      summary: Admin 分页列出项目源到目标传输策略
      description: 精确物理端点、表、列 scope 和审批信息仅向有效组织级 Admin 返回。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 传输策略页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPolicyPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [SecurityPolicies]
      operationId: createTransferPolicy
      summary: Admin 创建源修订到目标修订的 DRAFT 传输策略
      description: |
        请求必须分别给出 source/target 的 catalog/database、schema、table 和显式允许列。
        selection_mode=ALL_COLUMNS 也必须先由元数据解析为显式 allowed_columns 后提交，不接受
        *、正则或“运行时全部列”。服务端校验两侧表属于所选 DatasourceRevision，解析并固定
        PhysicalEndpointIdentity，按引擎标识符规则规范化/排序/去重后生成不可变 scope_json，
        再计算 scope_hash；客户端不能自报 scope_hash。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPolicyCreate'
            example:
              source_datasource_revision_id: 11111111-1111-4111-8111-111111111112
              target_datasource_revision_id: 22222222-2222-4222-8222-222222222223
              requested_scope:
                schema_version: '1.0'
                source:
                  catalog: sales
                  schema: ''
                  table: orders
                  selection_mode: ALL_COLUMNS
                  allowed_columns: [amount, id]
                target:
                  catalog: warehouse
                  schema: public
                  table: orders_copy
                  selection_mode: SELECTED_COLUMNS
                  allowed_columns: [amount, id]
              classification: STANDARD
      responses:
        '201':
          description: 已创建 DRAFT
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /transfer-policies/{transfer_policy_id}:
    parameters:
      - name: transfer_policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [SecurityPolicies]
      operationId: getTransferPolicy
      summary: Admin 获取传输策略及脱敏审批摘要
      description: 精确物理端点、表、列 scope 和审批信息仅向有效组织级 Admin 返回。
      responses:
        '200':
          description: 传输策略
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [SecurityPolicies]
      operationId: updateTransferPolicy
      summary: Admin 修订 DRAFT 或撤销策略
      description: 修改 source、target、requested_scope 或 classification 会把策略退回 DRAFT、清空旧审批并重算规范化 scope_json/scope_hash；ACTIVE 只允许变为 REVOKED。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPolicyPatch'
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /transfer-policies/{transfer_policy_id}/submit:
    parameters:
      - name: transfer_policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      tags: [SecurityPolicies]
      operationId: submitTransferPolicy
      summary: Admin 提交策略审批
      description: expected_scope_hash 必须等于当前规范化 scope_hash，防止提交旧页面看到的范围。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPolicySubmit'
            example:
              expected_scope_hash: 5f70bf18a08660b49f80c16fb9c0aa31c5e158d1471c4f4637ae0f0bde8f26f5
      responses:
        '200':
          description: 状态进入 PENDING_APPROVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /transfer-policies/{transfer_policy_id}/approvals:
    parameters:
      - name: transfer_policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      tags: [SecurityPolicies]
      operationId: decideTransferPolicy
      summary: 不同 Admin 审批或拒绝传输策略
      description: STANDARD 至少一名 Admin 批准；SENSITIVE 至少两名不同 Admin 批准。申请人不得批准自己的策略。审批请求必须固定当前 expected_scope_hash；scope/revision/classification 任一修改即使旧审批失效。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPolicyDecision'
            example:
              decision: APPROVED
              expected_scope_hash: 5f70bf18a08660b49f80c16fb9c0aa31c5e158d1471c4f4637ae0f0bde8f26f5
              comment: 已核对源目标表与显式列范围
      responses:
        '200':
          description: 当前策略；达到门槛后原子进入 ACTIVE，任一拒绝立即进入 REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{project_id}/jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Jobs]
      operationId: listJobs
