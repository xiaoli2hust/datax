    CredentialSecretStatus:
      type: string
      enum: [ACTIVE, RETIRED, REVOKED, COMPROMISED]
    CredentialSecretEnvelopeSummary:
      type: object
      additionalProperties: false
      description: 只含 Envelope 生命周期与完整性元数据，不含 encrypted_dek 或 KEK 材料。
      required:
        - envelope_version
        - kek_version
        - wrapping_algorithm
        - status
        - wrapped_dek_sha256
        - created_at
      properties:
        envelope_version:
          type: integer
          minimum: 1
        kek_version:
          type: string
          minLength: 1
          maxLength: 64
        wrapping_algorithm:
          const: AES-256-KWP
        status:
          type: string
          enum: [ACTIVE, SUPERSEDED]
        wrapped_dek_sha256:
          $ref: '#/components/schemas/Sha256'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CredentialSecretSummary:
      type: object
      additionalProperties: false
      description: Admin-only 的非秘密凭据版本元数据；永不返回 secret ID、ciphertext、nonce 或 DEK。
      required:
        - secret_version
        - status
        - status_reason_code
        - status_changed_at
        - created_at
        - active_envelope
      properties:
        secret_version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/CredentialSecretStatus'
        status_reason_code:
          type: [string, 'null']
          maxLength: 64
        status_changed_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        active_envelope:
          oneOf:
            - $ref: '#/components/schemas/CredentialSecretEnvelopeSummary'
            - type: 'null'
    CredentialSecretStatusChange:
      type: object
      additionalProperties: false
      required: [status, reason_code]
      properties:
        status:
          type: string
          enum: [RETIRED, REVOKED, COMPROMISED]
        reason_code:
          type: string
          pattern: '^[A-Z0-9_]+$'
          minLength: 1
          maxLength: 64
    DatasourceRedactedSummary:
      type: object
      additionalProperties: false
      description: 项目可读最小披露形状；不含真实 host、port、database_name、default_schema 或 username。
      required:
        - id
        - project_id
        - name
        - description
        - engine
        - endpoint_redacted
