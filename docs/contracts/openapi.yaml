        partial_write_policy:
          const: MANUAL_REMEDIATE
        source_quiescence_confirmed_by:
          $ref: '#/components/schemas/Uuid'
        source_quiescence_accepted_at:
          $ref: '#/components/schemas/Timestamp'
        target_exclusivity_confirmed_by:
          $ref: '#/components/schemas/Uuid'
          description: 接受目标排他确认的应用用户身份；DBA 责任类型不改变审计 actor。
        target_exclusivity_responsible_party:
          type: string
          enum: [OPERATOR, DBA]
        target_exclusivity_accepted_at:
          $ref: '#/components/schemas/Timestamp'
        target_exclusivity_statement_version:
          const: '1.0'
        target_exclusivity_valid_until:
          $ref: '#/components/schemas/Timestamp'
          description: Worker 启动前固化的人工声明截止时间；必须晚于 accepted_at，但不能代替运行期撤回检查。
        target_exclusivity_confirmation_sha256:
          $ref: '#/components/schemas/Sha256'
          description: 对 Execution 固化的目标排他确认计算的安全摘要；人工确认不等于技术锁。
        target_empty_evidence:
          $ref: '#/components/schemas/TargetEmptyEvidence'
        target_lock_key_hash:
          $ref: '#/components/schemas/Sha256'
        target_fence_epoch:
          type: integer
          minimum: 1
        verification_oracle_schema_version:
          const: '1.0'
    VerificationSummary:
      type: object
      additionalProperties: false
      required:
        - oracle_version
        - result
        - inconclusive_reason
        - source_row_count
        - target_row_count
        - missing_row_count
        - unexpected_row_count
        - row_count_equal
        - multiset_sha256_equal
        - target_exclusivity_valid
        - target_snapshot_id
        - target_snapshot_started_at
        - target_snapshot_finished_at
        - source_multiset_sha256
        - target_multiset_sha256
        - artifact_sha256
        - finished_at
      properties:
        oracle_version:
          type: string
          pattern: '^oracle-v1\.[0-9]+$'
        result:
          type: string
          enum: [PASSED, FAILED, INCONCLUSIVE]
        inconclusive_reason:
          type: [string, 'null']
          enum:
            - SOURCE_QUIESCENCE_BROKEN
            - TARGET_LOCK_LOST
            - TARGET_EXCLUSIVITY_BROKEN
            - TARGET_SNAPSHOT_INVALID
            - SOURCE_READ_FAILED
            - TARGET_READ_FAILED
            - NORMALIZATION_FAILED
            - ORACLE_INTERNAL_ERROR
            - null
        source_row_count:
          type: [integer, 'null']
          minimum: 0
        target_row_count:
          type: [integer, 'null']
          minimum: 0
        missing_row_count:
          type: [integer, 'null']
          minimum: 0
        unexpected_row_count:
          type: [integer, 'null']
          minimum: 0
        row_count_equal:
          type: [boolean, 'null']
        multiset_sha256_equal:
          type: [boolean, 'null']
        target_exclusivity_valid:
          type: [boolean, 'null']
          description: 版本化声明处于 ACTIVE、未撤回、未过期，覆盖 TargetEmptyEvidence.checked_at 至目标一致性读事务完成，且未发现或获知平台外 DML/DDL；不构成对未报告或已回滚外部写的技术证明。
        target_snapshot_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
          description: oracle 目标端单一一致性读事务的非秘密快照标识。
        target_snapshot_started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        target_snapshot_finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        source_multiset_sha256:
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
        target_multiset_sha256:
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
        artifact_sha256:
          $ref: '#/components/schemas/Sha256'
          description: 对移除 artifact_sha256 后的 RFC 8785 oracle 产物重算。
        finished_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              result:
                const: INCONCLUSIVE
            required: [result]
          then:
            properties:
              inconclusive_reason:
                type: string
          else:
            properties:
              inconclusive_reason:
                type: 'null'
        - if:
            properties:
              result:
                enum: [PASSED, FAILED]
            required: [result]
          then:
            properties:
              source_row_count:
                type: integer
              target_row_count:
                type: integer
              missing_row_count:
                type: integer
              unexpected_row_count:
                type: integer
              row_count_equal:
                type: boolean
              multiset_sha256_equal:
                type: boolean
              target_exclusivity_valid:
                type: boolean
              target_snapshot_id:
                type: string
                minLength: 1
              target_snapshot_started_at:
                $ref: '#/components/schemas/Timestamp'
              target_snapshot_finished_at:
                $ref: '#/components/schemas/Timestamp'
              source_multiset_sha256:
                $ref: '#/components/schemas/Sha256'
              target_multiset_sha256:
                $ref: '#/components/schemas/Sha256'
        - if:
            properties:
              result:
                const: PASSED
            required: [result]
          then:
            properties:
              missing_row_count:
                const: 0
              unexpected_row_count:
                const: 0
              row_count_equal:
                const: true
              multiset_sha256_equal:
                const: true
              target_exclusivity_valid:
                const: true

    Execution:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - job_id
        - job_version_id
        - rerun_of_execution_id
        - trigger_type
        - requested_by
        - process_state
        - data_effect
        - verification_state
        - target_exclusivity_confirmation
        - target_exclusivity_status
        - target_exclusivity_revoked_at
        - target_exclusivity_revocation_reason
        - source_datasource_revision_id
        - target_datasource_revision_id
        - source_endpoint_policy_revision_id
        - target_endpoint_policy_revision_id
        - target_namespace_id
        - target_copy_lock
        - source_secret_version
        - target_secret_version
        - source_secret_envelope_id
        - target_secret_envelope_id
        - source_connection_evidence_id
        - target_connection_evidence_id
        - capacity_profile
        - service_reservation_seconds
        - queue_eligibility_state
        - queue_block_reason
        - queue_state_changed_at
        - eligible_wait_milliseconds
        - log_incomplete
        - log_raw_received_bytes
        - log_redacted_received_bytes
        - log_stored_bytes
        - log_dropped_bytes
        - resolved_config_hash
        - runtime_snapshot
        - verification_summary
        - queued_at
        - started_at
        - finished_at
        - exit_code
        - failure_code
        - failure_message
        - summary_parse_status
        - run_summary
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        job_id:
          $ref: '#/components/schemas/Uuid'
        job_version_id:
          $ref: '#/components/schemas/Uuid'
        rerun_of_execution_id:
          $ref: '#/components/schemas/NullableUuid'
        trigger_type:
          const: MANUAL
        requested_by:
          $ref: '#/components/schemas/Uuid'
        process_state:
          $ref: '#/components/schemas/ProcessState'
        data_effect:
          $ref: '#/components/schemas/DataEffect'
        verification_state:
          $ref: '#/components/schemas/VerificationState'
        target_exclusivity_confirmation:
          $ref: '#/components/schemas/TargetExclusivityConfirmation'
          description: 创建 Execution 时固化的人工目标排他前提；实际 actor、接受时间与摘要在运行快照和审计事件中固定。
        target_exclusivity_status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
          description: 最近一次执行状态推进或 oracle 结论时评估并持久化的声明状态；终态后不因墙上时钟流逝改写历史结论。
        target_exclusivity_revoked_at:
          $ref: '#/components/schemas/NullableTimestamp'
        target_exclusivity_revocation_reason:
          type: [string, 'null']
          enum:
            - OPERATOR_REVOKED
            - DBA_REVOKED
            - EXTERNAL_DML_DDL_REPORTED
            - CHANGE_FREEZE_BROKEN
            - VALIDITY_WINDOW_EXPIRED
            - null
        source_datasource_revision_id:
          $ref: '#/components/schemas/Uuid'
        target_datasource_revision_id:
          $ref: '#/components/schemas/Uuid'
        source_endpoint_policy_revision_id:
          $ref: '#/components/schemas/Uuid'
          description: 创建 Execution 时从不可变 JobVersion 固定；即使尚未领取也不得为 null。
        target_endpoint_policy_revision_id:
          $ref: '#/components/schemas/Uuid'
          description: 创建 Execution 时从不可变 JobVersion 固定；即使尚未领取也不得为 null。
        target_namespace_id:
          $ref: '#/components/schemas/Uuid'
        target_copy_lock:
          $ref: '#/components/schemas/TargetCopyLockSummary'
        source_secret_version:
          type: [integer, 'null']
          minimum: 1
          description: Worker 固定的安全版本号；不返回 secret ID、密文或密钥材料。
        target_secret_version:
          type: [integer, 'null']
          minimum: 1
          description: Worker 固定的安全版本号；不返回 secret ID、密文或密钥材料。
        source_secret_envelope_id:
          $ref: '#/components/schemas/NullableUuid'
        target_secret_envelope_id:
          $ref: '#/components/schemas/NullableUuid'
        source_connection_evidence_id:
          $ref: '#/components/schemas/NullableUuid'
        target_connection_evidence_id:
          $ref: '#/components/schemas/NullableUuid'
        capacity_profile:
          type: string
          enum: [LIGHTWEIGHT, LARGE]
        service_reservation_seconds:
          type: integer
          enum: [360, 3600]
        queue_eligibility_state:
          type: string
          enum: [ELIGIBLE, BLOCKED]
        queue_block_reason:
          type: [string, 'null']
          maxLength: 64
        queue_state_changed_at:
          $ref: '#/components/schemas/Timestamp'
        eligible_wait_milliseconds:
          type: integer
          minimum: 0
        log_incomplete:
          type: boolean
        log_raw_received_bytes:
          type: integer
          minimum: 0
        log_redacted_received_bytes:
          type: integer
          minimum: 0
        log_stored_bytes:
          type: integer
          minimum: 0
        log_dropped_bytes:
          type: integer
          minimum: 0
        resolved_config_hash:
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
          description: 注入凭据后的实际配置只计算哈希，完整配置不持久化、不返回。
        runtime_snapshot:
          oneOf:
            - $ref: '#/components/schemas/ExecutionRuntimeSnapshot'
            - type: 'null'
        verification_summary:
          oneOf:
            - $ref: '#/components/schemas/VerificationSummary'
            - type: 'null'
        queued_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        exit_code:
          type: [integer, 'null']
        failure_code:
          type: [string, 'null']
          maxLength: 64
        failure_message:
          type: [string, 'null']
          maxLength: 2000
        summary_parse_status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
        run_summary:
          oneOf:
            - $ref: '#/components/schemas/RunSummary'
            - type: 'null'
      allOf:
        - if:
            properties:
              process_state:
                const: QUEUED
            required: [process_state]
          then:
            properties:
              target_copy_lock:
                properties:
                  state:
                    const: RESERVED
                  activated_at:
                    type: 'null'
                  released_at:
                    type: 'null'
                  fence_epoch:
                    type: 'null'
              runtime_snapshot:
                type: 'null'
              started_at:
                type: 'null'
              finished_at:
                type: 'null'
        - if:
            properties:
              process_state:
                const: CANCELED
              target_copy_lock:
                properties:
                  state:
                    const: RELEASED
                  activated_at:
                    type: 'null'
                required: [state, activated_at]
            required: [process_state, target_copy_lock]
          then:
            description: RELEASED 且从未 activated 的目标锁是未领取取消的机器判据；不能再以 runtime_snapshot=null 单独判断，因为已领取但 preflight 尚未完成的 STARTING Attempt 也允许为 null。
            properties:
              runtime_snapshot:
                type: 'null'
              data_effect:
                const: NONE
              verification_state:
                const: NOT_STARTED
              target_copy_lock:
                properties:
                  state:
                    const: RELEASED
                  activated_at:
                    type: 'null'
                  released_at:
                    $ref: '#/components/schemas/Timestamp'
                  fence_epoch:
                    type: 'null'
              started_at:
                type: 'null'
              finished_at:
                $ref: '#/components/schemas/Timestamp'
              verification_summary:
                type: 'null'
        - if:
            properties:
              process_state:
                enum: [STARTING, CANCEL_REQUESTED]
            required: [process_state]
          then:
            description: 这些状态只可能在领取事务提交后出现；领取事务原子生成 Attempt/fence 并激活目标锁。真实 preflight 完成前 runtime_snapshot 允许为 null，完成后一次性固定且不可覆盖。
            properties:
              runtime_snapshot:
                oneOf:
                  - $ref: '#/components/schemas/ExecutionRuntimeSnapshot'
                  - type: 'null'
              target_copy_lock:
                properties:
                  state:
                    const: ACTIVE
                  activated_at:
                    $ref: '#/components/schemas/Timestamp'
                  released_at:
                    type: 'null'
                  fence_epoch:
                    type: integer
                    minimum: 1
        - if:
            properties:
              process_state:
                enum: [RUNNING, VERIFYING]
            required: [process_state]
          then:
            description: STARTING 只有在真实 preflight 证据已完整固化后才能进入这些状态。
            properties:
              runtime_snapshot:
                $ref: '#/components/schemas/ExecutionRuntimeSnapshot'
              target_copy_lock:
                properties:
                  state:
                    const: ACTIVE
                  activated_at:
                    $ref: '#/components/schemas/Timestamp'
                  released_at:
                    type: 'null'
                  fence_epoch:
                    type: integer
                    minimum: 1
        - if:
            properties:
              process_state:
                enum: [FAILED, LOST]
            required: [process_state]
          then:
            description: 这些非成功终态可能发生在 preflight 完成前或 DataX 启动后；两者都来自已提交的领取事务并保留恢复门禁，不能以 runtime_snapshot 是否为 null 判断是否领取。
            properties:
              runtime_snapshot:
                oneOf:
                  - $ref: '#/components/schemas/ExecutionRuntimeSnapshot'
                  - type: 'null'
              target_copy_lock:
                properties:
                  state:
                    const: RECOVERY_REQUIRED
                  activated_at:
                    $ref: '#/components/schemas/Timestamp'
                  released_at:
                    type: 'null'
                  fence_epoch:
                    type: integer
                    minimum: 1
        - if:
            properties:
              process_state:
                const: TIMED_OUT
            required: [process_state]
          then:
            description: TIMED_OUT 只能发生在 DataX 已启动后，因此必须已有完整 preflight 运行快照并保留恢复门禁。
            properties:
              runtime_snapshot:
                $ref: '#/components/schemas/ExecutionRuntimeSnapshot'
              target_copy_lock:
                properties:
                  state:
                    const: RECOVERY_REQUIRED
                  activated_at:
                    $ref: '#/components/schemas/Timestamp'
                  released_at:
                    type: 'null'
                  fence_epoch:
                    type: integer
                    minimum: 1
        - if:
            properties:
              process_state:
                const: CANCELED
              target_copy_lock:
                properties:
                  state:
                    const: RECOVERY_REQUIRED
                required: [state]
            required: [process_state, target_copy_lock]
          then:
            description: RECOVERY_REQUIRED 表示已领取取消；取消可发生在 preflight 完成前，因此 runtime_snapshot 可为 null，但活动 fence/Attempt 事实必须保留。
            properties:
              runtime_snapshot:
                oneOf:
                  - $ref: '#/components/schemas/ExecutionRuntimeSnapshot'
                  - type: 'null'
              target_copy_lock:
                properties:
                  activated_at:
                    $ref: '#/components/schemas/Timestamp'
                  released_at:
                    type: 'null'
                  fence_epoch:
                    type: integer
                    minimum: 1
        - if:
            properties:
              target_exclusivity_status:
                const: ACTIVE
            required: [target_exclusivity_status]
          then:
            properties:
              target_exclusivity_revoked_at:
                type: 'null'
              target_exclusivity_revocation_reason:
                type: 'null'
        - if:
            properties:
              target_exclusivity_status:
                const: REVOKED
            required: [target_exclusivity_status]
          then:
            properties:
              target_exclusivity_revoked_at:
                $ref: '#/components/schemas/Timestamp'
              target_exclusivity_revocation_reason:
                type: string
                enum:
                  - OPERATOR_REVOKED
                  - DBA_REVOKED
                  - EXTERNAL_DML_DDL_REPORTED
                  - CHANGE_FREEZE_BROKEN
        - if:
            properties:
              target_exclusivity_status:
                const: EXPIRED
            required: [target_exclusivity_status]
          then:
            properties:
              target_exclusivity_revoked_at:
                type: 'null'
              target_exclusivity_revocation_reason:
                const: VALIDITY_WINDOW_EXPIRED
        - if:
            properties:
              process_state:
                const: SUCCEEDED
            required: [process_state]
          then:
            properties:
              runtime_snapshot:
                $ref: '#/components/schemas/ExecutionRuntimeSnapshot'
              data_effect:
                const: CONFIRMED
              verification_state:
                const: PASSED
              target_exclusivity_status:
                const: ACTIVE
              target_copy_lock:
                properties:
                  state:
                    const: RELEASED
                  activated_at:
                    $ref: '#/components/schemas/Timestamp'
                  released_at:
                    $ref: '#/components/schemas/Timestamp'
                  fence_epoch:
                    type: integer
                    minimum: 1
              exit_code:
                const: 0
              verification_summary:
                $ref: '#/components/schemas/VerificationSummary'
            oneOf:
              - properties:
                  summary_parse_status:
                    const: SUCCEEDED
                  run_summary:
                    allOf:
                      - $ref: '#/components/schemas/RunSummary'
                      - properties:
                          records_failed:
                            const: 0
              - properties:
                  summary_parse_status:
                    const: FAILED
                  run_summary:
                    type: 'null'
                description: 日志汇总解析失败只丢失诊断指标；固定 DataX errorLimit=0、exit 0 与独立 oracle PASSED 仍可形成业务成功。
        - if:
            properties:
              process_state:
                const: VERIFYING
            required: [process_state]
          then:
            properties:
              verification_state:
                enum: [NOT_STARTED, VERIFYING]
              exit_code:
                const: 0
        - if:
            properties:
              verification_state:
                const: NOT_STARTED
            required: [verification_state]
          then:
            properties:
              verification_summary:
                type: 'null'
        - if:
            properties:
              verification_state:
                enum: [PASSED, FAILED, INCONCLUSIVE]
            required: [verification_state]
          then:
            properties:
              verification_summary:
                $ref: '#/components/schemas/VerificationSummary'
        - if:
            properties:
              verification_state:
                const: PASSED
            required: [verification_state]
          then:
            properties:
              verification_summary:
                allOf:
                  - $ref: '#/components/schemas/VerificationSummary'
                  - properties:
                      result:
                        const: PASSED
        - if:
            properties:
              verification_state:
                const: FAILED
            required: [verification_state]
          then:
            properties:
              verification_summary:
                allOf:
                  - $ref: '#/components/schemas/VerificationSummary'
                  - properties:
                      result:
                        const: FAILED
        - if:
            properties:
              verification_state:
                const: INCONCLUSIVE
            required: [verification_state]
          then:
            properties:
              verification_summary:
                allOf:
                  - $ref: '#/components/schemas/VerificationSummary'
                  - properties:
                      result:
                        const: INCONCLUSIVE
        - if:
            properties:
              verification_state:
                enum: [FAILED, INCONCLUSIVE]
            required: [verification_state]
          then:
            properties:
              process_state:
                const: FAILED
    RunSummary:
      type: object
      additionalProperties: false
      required:
        - records_read
        - records_written
        - records_failed
        - bytes_read
        - average_bytes_per_second
        - average_records_per_second
      properties:
        records_read:
          type: integer
          minimum: 0
        records_written:
          type: integer
          minimum: 0
        records_failed:
          type: integer
          minimum: 0
          description: DataX 统计的脏行数；V1 只允许 0，任何正数都不能进入业务成功。
        bytes_read:
          type: integer
          minimum: 0
        average_bytes_per_second:
          type: number
          minimum: 0
        average_records_per_second:
          type: number
          minimum: 0
    ExecutionCreate:
      type: object
      additionalProperties: false
      required: [job_version_id, source_quiescence_confirmation, target_exclusivity_confirmation]
      properties:
        job_version_id:
          $ref: '#/components/schemas/Uuid'
        source_quiescence_confirmation:
          $ref: '#/components/schemas/SourceQuiescenceConfirmation'
        target_exclusivity_confirmation:
          $ref: '#/components/schemas/TargetExclusivityConfirmation'
    ExecutionRerunCreate:
      type: object
      additionalProperties: false
      required: [source_quiescence_confirmation, target_exclusivity_confirmation, recovery_gate_id]
      properties:
        source_quiescence_confirmation:
          $ref: '#/components/schemas/SourceQuiescenceConfirmation'
        target_exclusivity_confirmation:
          $ref: '#/components/schemas/TargetExclusivityConfirmation'
        recovery_gate_id:
          $ref: '#/components/schemas/Uuid'
          description: 必须引用原执行经如实处置确认与 Worker 空表复检得到的 VERIFIED 门禁；确认可明确无需清理。
    RecoveryGate:
      type: object
      additionalProperties: false
      required:
        - id
        - execution_id
        - target_namespace_id
        - status
        - data_effect_at_open
        - remediation_confirmation
        - target_empty_evidence
        - latest_recovery_probe_id
        - submitted_at
        - verified_at
        - reason_code
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        execution_id:
          $ref: '#/components/schemas/Uuid'
        target_namespace_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [OPEN, REMEDIATION_SUBMITTED, VERIFIED, REJECTED]
        data_effect_at_open:
          $ref: '#/components/schemas/DataEffect'
        remediation_confirmation:
          oneOf:
            - $ref: '#/components/schemas/RemediationConfirmation'
            - type: 'null'
        target_empty_evidence:
          oneOf:
            - $ref: '#/components/schemas/TargetEmptyEvidence'
            - type: 'null'
        latest_recovery_probe_id:
          $ref: '#/components/schemas/NullableUuid'
        submitted_at:
          $ref: '#/components/schemas/NullableTimestamp'
        verified_at:
          $ref: '#/components/schemas/NullableTimestamp'
        reason_code:
          type: [string, 'null']
          maxLength: 64
    RecoveryProbeAttempt:
      type: object
      additionalProperties: false
      description: RecoveryProbe 的安全 Attempt 摘要；不返回 lease token、主机 PID 或 cgroup 身份。
      required:
        - id
        - recovery_probe_id
        - attempt_no
        - fence_epoch
        - started_at
        - finished_at
        - termination_reason
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        recovery_probe_id:
          $ref: '#/components/schemas/Uuid'
        attempt_no:
          type: integer
          minimum: 1
        fence_epoch:
          type: integer
          minimum: 1
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        termination_reason:
          type: [string, 'null']
          maxLength: 64
    RecoveryProbe:
      type: object
      additionalProperties: false
      description: 不启动 DataX 的独立恢复空表探针；使用自身事实队列、Attempt、lease 和 fence。
      required:
        - id
        - project_id
        - recovery_gate_id
        - target_namespace_id
        - target_datasource_revision_id
        - target_endpoint_policy_revision_id
        - process_state
        - result
        - fence_epoch
        - active_attempt
        - service_reservation_seconds
        - queue_eligibility_state
        - queue_block_reason
        - queue_state_changed_at
        - eligible_wait_milliseconds
        - queued_at
        - finished_at
        - target_connection_evidence_id
        - target_empty_evidence
        - failure_code
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        recovery_gate_id:
          $ref: '#/components/schemas/Uuid'
        target_namespace_id:
          $ref: '#/components/schemas/Uuid'
        target_datasource_revision_id:
          $ref: '#/components/schemas/Uuid'
        target_endpoint_policy_revision_id:
          $ref: '#/components/schemas/NullableUuid'
        process_state:
          type: string
          enum: [QUEUED, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELED, LOST]
        result:
          type: string
          enum: [NOT_STARTED, EMPTY, NONEMPTY, INCONCLUSIVE]
        fence_epoch:
          type: integer
          minimum: 0
        active_attempt:
          oneOf:
            - $ref: '#/components/schemas/RecoveryProbeAttempt'
            - type: 'null'
        service_reservation_seconds:
          type: integer
          minimum: 1
        queue_eligibility_state:
          type: string
          enum: [ELIGIBLE, BLOCKED]
        queue_block_reason:
          type: [string, 'null']
          maxLength: 64
        queue_state_changed_at:
          $ref: '#/components/schemas/Timestamp'
        eligible_wait_milliseconds:
          type: integer
          minimum: 0
        queued_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        target_connection_evidence_id:
          $ref: '#/components/schemas/NullableUuid'
        target_empty_evidence:
          oneOf:
            - $ref: '#/components/schemas/TargetEmptyEvidence'
            - type: 'null'
        failure_code:
          type: [string, 'null']
          maxLength: 64
      allOf:
        - if:
            properties:
              process_state:
                const: SUCCEEDED
            required: [process_state]
          then:
            properties:
              result:
                const: EMPTY
    RecoverySubmission:
      type: object
      additionalProperties: false
      required: [recovery_gate, recovery_probe]
      properties:
        recovery_gate:
          $ref: '#/components/schemas/RecoveryGate'
        recovery_probe:
          $ref: '#/components/schemas/RecoveryProbe'
    ExecutionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Execution'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    CancelExecutionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CancelRequest:
      type: object
      additionalProperties: false
      required: [id, execution_id, status, requested_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        execution_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [PENDING, ACKNOWLEDGED, COMPLETED, REJECTED]
        requested_at:
          $ref: '#/components/schemas/Timestamp'
    LogLine:
      type: object
      additionalProperties: false
      required:
        - sequence
        - timestamp
        - stream
        - level
        - message
        - line_truncated
        - raw_received_bytes
        - redacted_received_bytes
        - stored_bytes
        - dropped_bytes
      properties:
        sequence:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        stream:
          type: string
          enum: [STDOUT, STDERR, SYSTEM]
        level:
          type: string
          enum: [TRACE, DEBUG, INFO, WARN, ERROR, UNKNOWN]
        message:
          type: string
          maxLength: 16384
        line_truncated:
          type: boolean
        raw_received_bytes:
          type: integer
          minimum: 0
          description: 脱敏前仅计数的输入字节；原文不持久化。
        redacted_received_bytes:
          type: integer
          minimum: 0
          description: 脱敏后、行级截断前字节。
        stored_bytes:
          type: integer
          minimum: 0
        dropped_bytes:
          type: integer
          minimum: 0
    LogGap:
      type: object
      additionalProperties: false
      description: 任一日志缺失、不连续、截断或无法安全脱敏都必须显式登记，不能用 eof 隐藏。
      required:
        - gap_no
        - reason
        - after_sequence
        - before_sequence
        - raw_received_bytes
        - redacted_received_bytes
        - stored_bytes
        - dropped_bytes
        - detected_at
        - evidence_hash
      properties:
        gap_no:
          type: integer
          minimum: 1
        reason:
          type: string
          enum:
            - LINE_LIMIT
            - EXECUTION_LIMIT
            - RING_EVICTION
            - SOURCE_READ_ERROR
            - DECODE_ERROR
            - REDACTION_FAILURE
            - STORAGE_FAILURE
            - FENCE_LOST
        after_sequence:
          type: [integer, 'null']
          minimum: 1
        before_sequence:
          type: [integer, 'null']
          minimum: 1
        raw_received_bytes:
          type: integer
          minimum: 0
        redacted_received_bytes:
          type: integer
          minimum: 0
        stored_bytes:
          type: integer
          minimum: 0
        dropped_bytes:
          type: integer
          minimum: 0
        detected_at:
          $ref: '#/components/schemas/Timestamp'
        evidence_hash:
          $ref: '#/components/schemas/Sha256'
    LogPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - eof
        - redaction_rules_version
        - truncated
        - incomplete
        - raw_received_bytes
        - redacted_received_bytes
        - stored_bytes
        - reason
        - dropped_bytes
        - first_truncated_sequence
        - gap_count
        - gaps
        - expires_at
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LogLine'
        next_cursor:
          type: string
          minLength: 1
        eof:
          type: boolean
        redaction_rules_version:
          type: string
          maxLength: 32
        truncated:
          type: boolean
          description: true 表示采集阶段已有原序字节未持久化；cursor 不能恢复这些字节。
        incomplete:
          type: boolean
          description: 存在任一 LogGap 即为 true；与 truncated 是不同维度。
        raw_received_bytes:
          type: integer
          minimum: 0
          description: 截止响应时脱敏前仅计数的输入字节；原文不持久化。
        redacted_received_bytes:
          type: integer
          minimum: 0
          description: 脱敏后、截断或保留决策前的字节数。
        stored_bytes:
          type: integer
          minimum: 0
        reason:
          type: string
          enum: [NONE, EXECUTION_LIMIT, LINE_LIMIT, RING_EVICTION]
        dropped_bytes:
          type: integer
          minimum: 0
        first_truncated_sequence:
          type: [integer, 'null']
          minimum: 1
        gap_count:
          type: integer
          minimum: 0
        gaps:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LogGap'
        expires_at:
          $ref: '#/components/schemas/Timestamp'

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: './audit-event.v1.schema.json'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    ComponentHealth:
      type: object
      additionalProperties: false
      required: [status, code]
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, checked_at, components]
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
        version:
          type: string
          maxLength: 64
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentHealth'
