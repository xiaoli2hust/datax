      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPatch'
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /jobs/{job_id}/validate:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Jobs]
      operationId: validateJobDraft
      summary: 校验当前已保存草稿
      description: 包括结构、权限、同一物理表别名自复制阻断、Schema 漂移、类型兼容，以及每个 source/target mapping 都是当前 ACTIVE TransferPolicy 精确 scope 的子集。
      responses:
        '200':
