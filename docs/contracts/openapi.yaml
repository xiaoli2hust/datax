            to:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            states:
              type: array
              maxItems: 9
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ExecutionState'
            exclude_job_status:
              oneOf:
                - $ref: '#/components/schemas/JobStatus'
                - type: 'null'
            has_published_version:
              type: [boolean, 'null']
            unresolved_failure:
              type: [boolean, 'null']
