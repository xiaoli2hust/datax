        execution_state_counts:
          $ref: '#/components/schemas/DashboardExecutionCounts'
        verification_state_counts:
          $ref: '#/components/schemas/DashboardVerificationCounts'
        data_effect_counts:
          $ref: '#/components/schemas/DashboardDataEffectCounts'
        success_rate:
          $ref: '#/components/schemas/DashboardSuccessRate'
        unresolved_failure_count:
          type: integer
          minimum: 0
        verified_records:
          $ref: '#/components/schemas/DashboardVerifiedRecords'
        recent_executions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/DashboardExecutionItem'
        recent_failures:
          type: array
          maxItems: 10
