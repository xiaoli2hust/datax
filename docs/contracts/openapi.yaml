    EndpointConnectionEvidence:
      type: object
      additionalProperties: false
      description: >-
        每次 TEST/METADATA/PREFLIGHT/DATAX/ORACLE/RECOVERY_PROBE 阶段的不可变
        DNS 与出口证据。DATAX 由独立 Java/JDBC 进程执行，当前平台不能从该进程可靠
        回传 socket peer；此时 peer_observation_status 为 ENFORCED_NOT_OBSERVED、
        peer_ip 为 null，selected_ip 仅表示已由精确 IP 内核租约强制的唯一允许目的地址，
        不得解释为观测到的 peer。
      required:
        - id
        - operation_kind
        - datasource_revision_id
        - endpoint_policy_revision_id
        - resolver_policy_version
        - resolved_ips
        - selected_ip
        - peer_observation_status
        - peer_ip
        - egress_policy_version
        - egress_evidence_hash
        - decision
        - evidence_hash
        - observed_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        operation_kind:
          type: string
          enum: [TEST, METADATA, PREFLIGHT, DATAX, ORACLE, RECOVERY_PROBE]
        datasource_revision_id:
          $ref: '#/components/schemas/Uuid'
        endpoint_policy_revision_id:
          $ref: '#/components/schemas/Uuid'
        resolver_policy_version:
          type: string
          minLength: 1
          maxLength: 64
        resolved_ips:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            oneOf:
              - type: string
                format: ipv4
              - type: string
                format: ipv6
        selected_ip:
          type: string
          minLength: 2
          maxLength: 45
        peer_observation_status:
          type: string
          enum: [OBSERVED, ENFORCED_NOT_OBSERVED]
        peer_ip:
          oneOf:
            - type: string
              minLength: 2
              maxLength: 45
            - type: 'null'
        egress_policy_version:
          type: string
          minLength: 1
          maxLength: 64
        egress_evidence_hash:
          $ref: '#/components/schemas/Sha256'
        decision:
          type: string
          enum: [ALLOWED, DENIED]
        evidence_hash:
          $ref: '#/components/schemas/Sha256'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
