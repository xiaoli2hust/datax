[package]
name = "datax-enterprise-studio-launcher"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "=2.2.0", features = ["pem"] }
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
wait-timeout = "=0.2.1"
zeroize = "=1.9.0"
